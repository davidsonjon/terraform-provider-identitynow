# CI workflow: build, vet, unit test, lint, docs-drift check, tflint, and
# terraform validate against the example configs. Runs on every push and
# pull request. Does NOT run acceptance tests (`make testacc`/`TF_ACC=1`) —
# those require live IdentityNow sandbox credentials and real create/modify/
# delete side effects, and per this repo's agent guardrails always require
# explicit human confirmation before running; they stay a manual/local-only
# step (see .github/agents/identitynow-terraform-provider-developer.agent.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, vet, and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: go build
        run: go build -v ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -v -cover -timeout=120s -parallel=10 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  docs-check:
    name: tfplugindocs generate (drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Regenerate docs
        run: go tool tfplugindocs generate --rendered-provider-name "identitynow"
      - name: Fail if docs/ is out of date
        run: |
          if ! git diff --exit-code -- docs/; then
            echo "::error::docs/ is out of date - run 'make docs' locally and commit the result."
            exit 1
          fi

  tflint:
    name: tflint (examples/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0
      - name: tflint --init
        run: tflint --init --config "${{ github.workspace }}/.tflint.hcl"
      - name: tflint examples/
        run: tflint --recursive --config "${{ github.workspace }}/.tflint.hcl" --chdir examples/

  validate-examples:
    name: terraform validate (examples/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: terraform validate every example
        run: ./scripts/validate-examples.sh
