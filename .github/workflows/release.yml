# Terraform Provider release workflow.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created.
on:
  push:
    tags:
      - 'v*'

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # This provider now cross-compiles ~14 GOOS/GOARCH targets against a much
    # larger dependency tree (sailpoint-oss/golang-sdk) than before the
    # OpenAPI-codegen rewrite. GoReleaser's default parallelism (= NumCPU)
    # runs that many `go build` invocations concurrently, and on a standard
    # GitHub-hosted runner (~7GB RAM) this was observed to silently OOM-kill
    # the runner itself twice in a row - surfacing only as an opaque
    # "runner has received a shutdown signal" error with no compiler output,
    # rather than a clear timeout/OOM message. An explicit timeout-minutes
    # turns any future genuine hang into a clear diagnostic instead.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # -p/--parallelism caps concurrent `go build` cross-compiles; left
          # at the default (NumCPU) this spiked memory high enough to OOM-kill
          # the runner on this larger codebase (see the job-level comment
          # above) - 2 keeps peak memory well under the standard runner's
          # ~7GB limit at a modest cost in wall-clock time.
          args: release --clean --parallelism 2
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
