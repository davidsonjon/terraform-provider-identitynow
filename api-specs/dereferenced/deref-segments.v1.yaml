    patch:
      operationId: patchSegmentV1
      security:
      - userAuth:
        - idn:segment:manage
      - applicationAuth:
        - idn:segment:manage
      x-sailpoint-userLevels:
      - ORG_ADMIN
      tags:
      - Segments
      summary: Update segment
      description: 'Use this API to update segment fields by using the [JSON Patch](https://tools.ietf.org/html/rfc6902)
        standard.

        >**Note:** Changes to a segment may take some time to propagate to all identities.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        x-sailpoint-resource-operation-id: listSegmentsV1
        description: The segment ID to modify.
        example: ef38f94347e94562b5bb8424a56397d8
      requestBody:
        required: true
        description: 'A list of segment update operations according to the [JSON Patch](https://tools.ietf.org/html/rfc6902)
          standard.


          The following fields are patchable:

          * name

          * description

          * owner

          * visibilityCriteria

          * active

          '
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                type: object
            examples:
              Set Visibility Criteria:
                description: Set the visibility criteria
                value:
                - op: replace
                  path: /visibilityCriteria
                  value:
                    expression:
                      operator: AND
                      children:
                      - operator: EQUALS
                        attribute: location
                        value:
                          type: STRING
                          value: Philadelphia
                      - operator: EQUALS
                        attribute: department
                        value:
                          type: STRING
                          value: HR
      responses:
        '200':
          description: Indicates the PATCH operation succeeded, and returns the segment's
            new representation.
          content:
            application/json:
              schema:
                type: object
                title: Segment
                properties:
                  id:
                    type: string
                    description: The segment's ID.
                    example: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
                  name:
                    type: string
                    description: The segment's business name.
                    example: segment-xyz
                  created:
                    type: string
                    format: date-time
                    description: The time when the segment is created.
                    example: '2020-01-01T00:00:00.000000Z'
                  modified:
                    type: string
                    format: date-time
                    description: The time when the segment is modified.
                    example: '2020-01-01T00:00:00.000000Z'
                  description:
                    type: string
                    description: The segment's optional description.
                    example: This segment represents xyz
                  owner:
                    type: object
                    nullable: true
                    description: The owner of this object.
                    properties:
                      type:
                        type: string
                        enum:
                        - IDENTITY
                        description: Owner type. This field must be either left null
                          or set to 'IDENTITY' on input, otherwise a 400 Bad Request
                          error will result.
                        example: IDENTITY
                      id:
                        type: string
                        description: Identity id
                        example: 2c9180a46faadee4016fb4e018c20639
                      name:
                        type: string
                        description: Human-readable display name of the owner. It
                          may be left null or omitted in a POST or PATCH. If set,
                          it must match the current value of the owner's display name,
                          otherwise a 400 Bad Request error will result.
                        example: support
                  visibilityCriteria:
                    type: object
                    title: Visibility Criteria
                    nullable: true
                    properties:
                      expression:
                        type: object
                        title: Expression
                        properties:
                          operator:
                            type: string
                            description: Operator for the expression
                            enum:
                            - AND
                            - EQUALS
                            example: EQUALS
                          attribute:
                            type: string
                            description: Name for the attribute
                            example: location
                            nullable: true
                          value:
                            type: object
                            title: Value
                            nullable: true
                            properties:
                              type:
                                type: string
                                description: The type of attribute value
                                example: STRING
                              value:
                                type: string
                                description: The attribute value
                                example: Austin
                          children:
                            type: array
                            nullable: true
                            description: List of expressions
                            items:
                              type: object
                              properties:
                                operator:
                                  type: string
                                  description: Operator for the expression
                                  enum:
                                  - AND
                                  - EQUALS
                                  example: EQUALS
                                attribute:
                                  type: string
                                  description: Name for the attribute
                                  example: location
                                  nullable: true
                                value:
                                  type: object
                                  title: Value
                                  nullable: true
                                  properties:
                                    type:
                                      type: string
                                      description: The type of attribute value
                                      example: STRING
                                    value:
                                      type: string
                                      description: The attribute value
                                      example: Austin
                                children:
                                  type: string
                                  nullable: true
                                  description: There cannot be anymore nested children.
                                    This will always be null.
                                  example: null
                            example: []
                  active:
                    type: boolean
                    description: This boolean indicates whether the segment is currently
                      active. Inactive segments have no effect.
                    default: false
                    example: true
