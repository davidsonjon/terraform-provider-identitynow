                            description: Name for the attribute
                            example: location
                            nullable: true
                          value:
                            type: object
                            title: Value
                            nullable: true
                            properties:
                              type:
                                type: string
                                description: The type of attribute value
                                example: STRING
                              value:
                                type: string
                                description: The attribute value
                                example: Austin
                          children:
                            type: array
                            nullable: true
                            description: List of expressions
                            items:
