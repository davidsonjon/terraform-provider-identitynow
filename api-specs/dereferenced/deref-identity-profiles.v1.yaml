  /identity-profiles/v1/import:
    post:
      operationId: importIdentityProfilesV1
      summary: Import identity profiles
      description: This imports previously exported identity profiles.
      tags:
      - Identity Profiles
      requestBody:
        description: Previously exported Identity Profiles.
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                title: Identity Profile Exported Object
                description: Identity profile exported object.
                properties:
                  version:
                    type: integer
                    example: 1
                    description: Version or object from the target service.
                    format: int32
                  self:
                    type: object
                    description: Self block for exported object.
                    properties:
                      type:
                        type: string
                        description: Exported object's DTO type.
                        enum:
                        - ACCESS_PROFILE
                        - ACCESS_REQUEST_CONFIG
                        - ATTR_SYNC_SOURCE_CONFIG
                        - AUTH_ORG
                        - CAMPAIGN_FILTER
                        - FORM_DEFINITION
                        - GOVERNANCE_GROUP
                        - IDENTITY_OBJECT_CONFIG
                        - IDENTITY_PROFILE
                        - LIFECYCLE_STATE
                        - NOTIFICATION_TEMPLATE
                        - PASSWORD_POLICY
                        - PASSWORD_SYNC_GROUP
                        - PUBLIC_IDENTITIES_CONFIG
                        - ROLE
                        - RULE
                        - SEGMENT
                        - SERVICE_DESK_INTEGRATION
                        - SOD_POLICY
                        - SOURCE
                        - TAG
                        - TRANSFORM
                        - TRIGGER_SUBSCRIPTION
                        - WORKFLOW
                        example: SOURCE
                      id:
                        type: string
                        description: Exported object's ID.
                        example: 2c9180835d191a86015d28455b4b232a
                      name:
                        type: string
                        description: Exported object's display name.
                        example: HR Active Directory
                  object:
                    type: object
                    title: Base Common Dto
                    properties:
                      id:
                        description: System-generated unique ID of the Object
                        type: string
                        example: id12345
                        readOnly: true
                      name:
                        description: Name of the Object
                        type: string
                        example: aName
                        nullable: true
                      created:
                        description: Creation date of the Object
                        type: string
                        example: '2015-05-28T14:07:17Z'
                        format: date-time
                        readOnly: true
                      modified:
                        description: Last modification date of the Object
                        type: string
                        example: '2015-05-28T14:07:17Z'
                        format: date-time
                        readOnly: true
                      description:
                        type: string
                        description: Identity profile's description.
                        example: My custom flat file profile
                        nullable: true
                      owner:
                        type: object
                        description: Identity profile's owner.
                        nullable: true
                        properties:
                          type:
                            type: string
                            enum:
                            - IDENTITY
                            description: Owner's object type.
                            example: IDENTITY
                          id:
                            type: string
                            description: Owner's ID.
                            example: 2c9180835d191a86015d28455b4b232a
                          name:
                            type: string
                            description: Owner's name.
                            example: William Wilson
                      priority:
                        type: integer
                        format: int64
                        description: Identity profile's priority.
                        example: 10
                      authoritativeSource:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - SOURCE
                            description: Authoritative source's object type.
                            example: SOURCE
                          id:
                            type: string
                            description: Authoritative source's ID.
                            example: 2c9180835d191a86015d28455b4b232a
                          name:
                            type: string
                            description: Authoritative source's name.
                            example: HR Active Directory
                      identityRefreshRequired:
                        type: boolean
                        default: false
                        description: Set this value to 'True' if an identity refresh
                          is necessary. You would typically want to trigger an identity
                          refresh when a change has been made on the source.
                        example: true
                      identityCount:
                        type: integer
                        description: Number of identities belonging to the identity
                          profile.
                        format: int32
                        example: 8
                      identityAttributeConfig:
                        type: object
                        title: Identity Attribute Config
                        description: Defines all the identity attribute mapping configurations.
                          This defines how to generate or collect data for each identity
                          attributes in identity refresh process.
                        properties:
                          enabled:
                            description: Backend will only promote values if the profile/mapping
                              is enabled.
                            type: boolean
                            default: false
                            example: true
                          attributeTransforms:
                            type: array
                            items:
                              type: object
                              title: Identity Attribute Transform
                              description: Transform definition for an identity attribute.
                              properties:
                                identityAttributeName:
                                  type: string
                                  description: Identity attribute's name.
                                  example: email
                                transformDefinition:
                                  description: Seaspray transform definition.
                                  type: object
                                  title: Transform Definition
                                  properties:
                                    type:
                                      type: string
                                      description: Transform definition type.
                                      example: accountAttribute
                                    attributes:
                                      type: object
                                      additionalProperties: true
                                      description: Arbitrary key-value pairs to store
                                        any metadata for the object
                                      example:
                                        attributeName: e-mail
                                        sourceName: MySource
                                        sourceId: 2c9180877a826e68017a8c0b03da1a53
                      identityExceptionReportReference:
                        type: object
                        title: Identity Exception Report Reference
                        nullable: true
                        properties:
                          taskResultId:
                            type: string
                            format: uuid
                            description: Task result ID.
                            example: 2b838de9-db9b-abcf-e646-d4f274ad4238
                          reportName:
                            type: string
                            example: My annual report
                            description: Report name.
                      hasTimeBasedAttr:
                        description: Indicates the value of `requiresPeriodicRefresh`
                          attribute for the identity profile.
                        type: boolean
                        default: false
                        example: true
                    required:
                    - name
                    - authoritativeSource
      responses:
        '200':
