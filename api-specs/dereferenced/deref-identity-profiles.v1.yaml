  /identity-profiles/v1/identity-preview:
    post:
      operationId: generateIdentityPreviewV1
      tags:
      - Identity Profiles
      summary: Generate identity profile preview
      description: This generates a non-persisted IdentityDetails object that will
        represent as the preview of the identities attribute when the given policy''s
        attribute config is applied.
      requestBody:
        description: Identity Preview request body.
        required: true
        content:
          application/json:
            schema:
              type: object
              title: Identity Preview Request
              properties:
                identityId:
                  type: string
                  format: uuid
                  example: 2c9180857893f12901789445619b0366
                  description: The Identity id
                identityAttributeConfig:
                  type: object
                  title: Identity Attribute Config
                  description: Defines all the identity attribute mapping configurations.
                    This defines how to generate or collect data for each identity
                    attributes in identity refresh process.
                  properties:
                    enabled:
                      description: Backend will only promote values if the profile/mapping
                        is enabled.
                      type: boolean
                      default: false
                      example: true
                    attributeTransforms:
                      type: array
                      items:
                        type: object
                        title: Identity Attribute Transform
                        description: Transform definition for an identity attribute.
                        properties:
                          identityAttributeName:
                            type: string
                            description: Identity attribute's name.
                            example: email
                          transformDefinition:
                            description: Seaspray transform definition.
                            type: object
                            title: Transform Definition
                            properties:
                              type:
                                type: string
                                description: Transform definition type.
                                example: accountAttribute
                              attributes:
                                type: object
                                additionalProperties: true
                                description: Arbitrary key-value pairs to store any
                                  metadata for the object
                                example:
