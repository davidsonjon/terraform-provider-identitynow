    patch:
      operationId: updateIdentityProfileV1
      tags:
      - Identity Profiles
      summary: Update identity profile
      description: "Update a specified identity profile with this PATCH request.\n\
        \  \nYou cannot update these fields:\n* id\n* created\n* modified\n* identityCount\n\
        * identityRefreshRequired\n* Authoritative Source and Identity Attribute Configuration\
        \ cannot be modified at the same time."
      parameters:
      - in: path
        name: identity-profile-id
        schema:
          type: string
          format: uuid
        required: true
        x-sailpoint-resource-operation-id: listIdentityProfilesV1
        description: Identity profile ID.
        example: ef38f94347e94562b5bb8424a56397d8
      requestBody:
        required: true
        description: List of identity profile update operations according to the [JSON
          Patch](https://tools.ietf.org/html/rfc6902) standard.
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                type: object
                title: Json Patch Operation
                description: A JSONPatch Operation as defined by [RFC 6902 - JSON
                  Patch](https://tools.ietf.org/html/rfc6902)
                required:
                - op
                - path
                properties:
                  op:
                    type: string
                    description: The operation to be performed
                    enum:
                    - add
                    - remove
                    - replace
                    - move
                    - copy
                    - test
                    example: replace
                  path:
                    type: string
                    description: A string JSON Pointer representing the target path
                      to an element to be affected by the operation
                    example: /description
                  value:
                    oneOf:
                    - type: string
                      example: New description
                      title: string
                    - type: boolean
                      example: true
                      title: boolean
                    - type: integer
                      example: 300
                      title: integer
                    - type: object
                      title: object
                      example:
                        attributes:
                          name: philip
                    - type: array
                      title: array
                      items:
                        anyOf:
                        - type: string
                        - type: integer
                        - type: object
                        example:
                        - '001'
                        - '002'
                        - '003'
                    description: The value to be used for the operation, required
                      for "add" and "replace" operations
                    example: New description
            examples:
              add-attribute-transform:
                summary: Add an attribute transform
                value:
                - op: add
                  path: /identityAttributeConfig/attributeTransforms/0
                  value:
                    identityAttributeName: location
                    transformDefinition:
                      type: accountAttribute
                      attributes:
                        sourceName: Employees
                        attributeName: location
                        sourceId: 2c91808878b7d63b0178c66ffcdc4ce4
      responses:
        '200':
          description: Updated identity profile.
          content:
            application/json:
              schema:
                type: object
                title: Base Common Dto
                properties:
                  id:
                    description: System-generated unique ID of the Object
                    type: string
                    example: id12345
                    readOnly: true
                  name:
                    description: Name of the Object
                    type: string
                    example: aName
                    nullable: true
                  created:
                    description: Creation date of the Object
                    type: string
                    example: '2015-05-28T14:07:17Z'
                    format: date-time
                    readOnly: true
                  modified:
                    description: Last modification date of the Object
                    type: string
                    example: '2015-05-28T14:07:17Z'
                    format: date-time
                    readOnly: true
                  description:
                    type: string
                    description: Identity profile's description.
                    example: My custom flat file profile
                    nullable: true
                  owner:
                    type: object
                    description: Identity profile's owner.
                    nullable: true
                    properties:
                      type:
                        type: string
                        enum:
                        - IDENTITY
                        description: Owner's object type.
                        example: IDENTITY
                      id:
                        type: string
                        description: Owner's ID.
                        example: 2c9180835d191a86015d28455b4b232a
                      name:
                        type: string
                        description: Owner's name.
                        example: William Wilson
                  priority:
                    type: integer
                    format: int64
                    description: Identity profile's priority.
                    example: 10
                  authoritativeSource:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - SOURCE
                        description: Authoritative source's object type.
                        example: SOURCE
                      id:
                        type: string
                        description: Authoritative source's ID.
                        example: 2c9180835d191a86015d28455b4b232a
                      name:
                        type: string
                        description: Authoritative source's name.
                        example: HR Active Directory
                  identityRefreshRequired:
                    type: boolean
                    default: false
                    description: Set this value to 'True' if an identity refresh is
                      necessary. You would typically want to trigger an identity refresh
                      when a change has been made on the source.
                    example: true
                  identityCount:
                    type: integer
                    description: Number of identities belonging to the identity profile.
                    format: int32
                    example: 8
                  identityAttributeConfig:
                    type: object
                    title: Identity Attribute Config
                    description: Defines all the identity attribute mapping configurations.
                      This defines how to generate or collect data for each identity
                      attributes in identity refresh process.
                    properties:
                      enabled:
                        description: Backend will only promote values if the profile/mapping
                          is enabled.
                        type: boolean
                        default: false
                        example: true
                      attributeTransforms:
                        type: array
                        items:
                          type: object
                          title: Identity Attribute Transform
                          description: Transform definition for an identity attribute.
                          properties:
                            identityAttributeName:
                              type: string
                              description: Identity attribute's name.
                              example: email
                            transformDefinition:
                              description: Seaspray transform definition.
                              type: object
                              title: Transform Definition
                              properties:
                                type:
                                  type: string
                                  description: Transform definition type.
                                  example: accountAttribute
                                attributes:
                                  type: object
                                  additionalProperties: true
                                  description: Arbitrary key-value pairs to store
                                    any metadata for the object
                                  example:
                                    attributeName: e-mail
                                    sourceName: MySource
                                    sourceId: 2c9180877a826e68017a8c0b03da1a53
                  identityExceptionReportReference:
                    type: object
                    title: Identity Exception Report Reference
                    nullable: true
                    properties:
                      taskResultId:
                        type: string
                        format: uuid
                        description: Task result ID.
                        example: 2b838de9-db9b-abcf-e646-d4f274ad4238
                      reportName:
                        type: string
                        example: My annual report
                        description: Report name.
                  hasTimeBasedAttr:
                    description: Indicates the value of `requiresPeriodicRefresh`
                      attribute for the identity profile.
                    type: boolean
                    default: false
                    example: true
                required:
                - name
