  /identity-profiles/v1/export:
    get:
      operationId: exportIdentityProfilesV1
      tags:
      - Identity Profiles
      summary: Export identity profiles
      description: This exports existing identity profiles in the format specified
        by the sp-config service.
      parameters:
      - in: query
        name: limit
        description: 'Max number of results to return.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: 250
        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 250
          default: 250
      - in: query
        name: offset
        description: 'Offset into the full result set. Usually specified with *limit*
          to paginate through the results.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: 0
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - in: query
        name: count
        description: 'If *true* it will populate the *X-Total-Count* response header
          with the number of results that would be returned if *limit* and *offset*
          were ignored.


          Since requesting a total count can have a performance impact, it is recommended
          not to send **count=true** if that value will not be used.


          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: true
        schema:
          type: boolean
          default: false
      - in: query
        name: filters
        required: false
        schema:
          type: string
        example: id eq "ef38f94347e94562b5bb8424a56397d8"
        description: 'Filter results using the standard syntax described in [V3 API
          Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


          Filtering is supported for the following fields and operators:


          **id**: *eq, ne*


          **name**: *eq, ne*


          **priority**: *eq, ne*'
      - in: query
        name: sorters
        required: false
        schema:
          type: string
          format: comma-separated
        example: id,name
        description: 'Sort results using the standard syntax described in [V3 API
          Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


          Sorting is supported for the following fields: **id, name, priority**'
      responses:
        '200':
          description: List of export objects with identity profiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: Identity Profile Exported Object
                  description: Identity profile exported object.
                  properties:
                    version:
                      type: integer
                      example: 1
                      description: Version or object from the target service.
                      format: int32
                    self:
                      type: object
                      description: Self block for exported object.
                      properties:
                        type:
                          type: string
                          description: Exported object's DTO type.
                          enum:
                          - ACCESS_PROFILE
                          - ACCESS_REQUEST_CONFIG
                          - ATTR_SYNC_SOURCE_CONFIG
                          - AUTH_ORG
                          - CAMPAIGN_FILTER
                          - FORM_DEFINITION
                          - GOVERNANCE_GROUP
                          - IDENTITY_OBJECT_CONFIG
                          - IDENTITY_PROFILE
                          - LIFECYCLE_STATE
                          - NOTIFICATION_TEMPLATE
                          - PASSWORD_POLICY
                          - PASSWORD_SYNC_GROUP
                          - PUBLIC_IDENTITIES_CONFIG
                          - ROLE
                          - RULE
                          - SEGMENT
                          - SERVICE_DESK_INTEGRATION
                          - SOD_POLICY
                          - SOURCE
                          - TAG
                          - TRANSFORM
                          - TRIGGER_SUBSCRIPTION
                          - WORKFLOW
                          example: SOURCE
                        id:
                          type: string
                          description: Exported object's ID.
                          example: 2c9180835d191a86015d28455b4b232a
                        name:
                          type: string
                          description: Exported object's display name.
                          example: HR Active Directory
                    object:
                      type: object
                      title: Base Common Dto
                      properties:
                        id:
                          description: System-generated unique ID of the Object
                          type: string
                          example: id12345
                          readOnly: true
