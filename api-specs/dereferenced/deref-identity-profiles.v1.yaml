                          description: Authoritative source's object type.
                          example: SOURCE
                        id:
                          type: string
                          description: Authoritative source's ID.
                          example: 2c9180835d191a86015d28455b4b232a
                        name:
                          type: string
                          description: Authoritative source's name.
                          example: HR Active Directory
                    identityRefreshRequired:
                      type: boolean
                      default: false
                      description: Set this value to 'True' if an identity refresh
                        is necessary. You would typically want to trigger an identity
                        refresh when a change has been made on the source.
                      example: true
                    identityCount:
                      type: integer
                      description: Number of identities belonging to the identity
                        profile.
                      format: int32
                      example: 8
                    identityAttributeConfig:
                      type: object
                      title: Identity Attribute Config
                      description: Defines all the identity attribute mapping configurations.
                        This defines how to generate or collect data for each identity
                        attributes in identity refresh process.
                      properties:
                        enabled:
                          description: Backend will only promote values if the profile/mapping
                            is enabled.
                          type: boolean
                          default: false
                          example: true
                        attributeTransforms:
                          type: array
                          items:
                            type: object
                            title: Identity Attribute Transform
                            description: Transform definition for an identity attribute.
                            properties:
                              identityAttributeName:
                                type: string
                                description: Identity attribute's name.
                                example: email
                              transformDefinition:
                                description: Seaspray transform definition.
                                type: object
                                title: Transform Definition
                                properties:
                                  type:
                                    type: string
                                    description: Transform definition type.
                                    example: accountAttribute
                                  attributes:
                                    type: object
                                    additionalProperties: true
                                    description: Arbitrary key-value pairs to store
                                      any metadata for the object
                                    example:
                                      attributeName: e-mail
                                      sourceName: MySource
                                      sourceId: 2c9180877a826e68017a8c0b03da1a53
                    identityExceptionReportReference:
                      type: object
                      title: Identity Exception Report Reference
                      nullable: true
                      properties:
                        taskResultId:
                          type: string
                          format: uuid
                          description: Task result ID.
                          example: 2b838de9-db9b-abcf-e646-d4f274ad4238
                        reportName:
                          type: string
                          example: My annual report
                          description: Report name.
                    hasTimeBasedAttr:
                      description: Indicates the value of `requiresPeriodicRefresh`
                        attribute for the identity profile.
                      type: boolean
                      default: false
                      example: true
                  required:
