openapi: 3.0.1
info:
  title: Identity Security Cloud API - Identity Profiles
  description: Use these APIs to interact with the Identity Security Cloud platform
    to achieve repeatable, automated processes with greater scalability. We encourage
    you to join the SailPoint Developer Community forum at https://developer.sailpoint.com/discuss
    to connect with other developers using our APIs.
  termsOfService: https://developer.sailpoint.com/discuss/tos
  contact:
    name: Developer Relations
    url: https://developer.sailpoint.com/discuss/api-help
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: v1
servers:
- url: https://{tenant}.api.identitynow.com
  description: This is the production API server.
  variables:
    tenant:
      default: sailpoint
      description: This is the name of your tenant, typically your company's name.
- url: https://{apiUrl}
  description: This is the versioned API server.
  variables:
    apiUrl:
      default: sailpoint.api.identitynow.com
      description: This is the api url of your tenant
tags:
- name: Identity Profiles
  description: "Use this API to implement identity profile functionality. \nWith this\
    \ functionality in place, administrators can view identity profiles and their\
    \ configurations. \n\nIdentity profiles represent the configurations that can\
    \ be applied to identities as a way of granting them a set of security and access,\
    \ as well as defining the mappings between their identity attributes and their\
    \ source attributes.  \n\nIn Identity Security Cloud, administrators can use the\
    \ Identities drop-down menu and select Identity Profiles to view the list of identity\
    \ profiles. \nThis list shows some details about each identity profile, along\
    \ with its status. \nThey can select an identity profile to view its settings,\
    \ its mappings between identity attributes and correlating source account attributes,\
    \ and its provisioning settings. \n\nRefer to [Creating Identity Profiles](https://documentation.sailpoint.com/saas/help/setup/identity_profiles.html)\
    \ for more information about identity profiles.\n"
paths:
  /identity-profiles/v1:
    get:
      operationId: listIdentityProfilesV1
      tags:
      - Identity Profiles
      summary: List identity profiles
      description: Get a list of identity profiles, based on the specified query parameters.
      parameters:
      - in: query
        name: limit
        description: 'Max number of results to return.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: 250
        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 250
          default: 250
      - in: query
        name: offset
        description: 'Offset into the full result set. Usually specified with *limit*
          to paginate through the results.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: 0
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - in: query
        name: count
        description: 'If *true* it will populate the *X-Total-Count* response header
          with the number of results that would be returned if *limit* and *offset*
          were ignored.


          Since requesting a total count can have a performance impact, it is recommended
          not to send **count=true** if that value will not be used.


          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: true
        schema:
          type: boolean
          default: false
      - in: query
        name: filters
        required: false
        schema:
          type: string
        example: id eq "ef38f94347e94562b5bb8424a56397d8"
        description: 'Filter results using the standard syntax described in [V3 API
          Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


          Filtering is supported for the following fields and operators:


          **id**: *eq, ne, ge, gt, in, le, sw*


          **name**: *eq, ne, ge, gt, in, le, sw*


          **priority**: *eq, ne*'
      - in: query
        name: sorters
        required: false
        schema:
          type: string
          format: comma-separated
        example: id,name
        description: 'Sort results using the standard syntax described in [V3 API
          Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


          Sorting is supported for the following fields: **id, name, priority, created,
          modified, owner.id, owner.name**'
      responses:
        '200':
          description: List of identity profiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: Base Common Dto
                  properties:
                    id:
                      description: System-generated unique ID of the Object
                      type: string
                      example: id12345
                      readOnly: true
                    name:
                      description: Name of the Object
                      type: string
                      example: aName
                      nullable: true
                    created:
                      description: Creation date of the Object
                      type: string
                      example: '2015-05-28T14:07:17Z'
                      format: date-time
                      readOnly: true
                    modified:
                      description: Last modification date of the Object
                      type: string
                      example: '2015-05-28T14:07:17Z'
                      format: date-time
                      readOnly: true
                    description:
                      type: string
                      description: Identity profile's description.
                      example: My custom flat file profile
                      nullable: true
                    owner:
                      type: object
                      description: Identity profile's owner.
                      nullable: true
                      properties:
                        type:
                          type: string
                          enum:
                          - IDENTITY
                          description: Owner's object type.
                          example: IDENTITY
                        id:
                          type: string
                          description: Owner's ID.
                          example: 2c9180835d191a86015d28455b4b232a
                        name:
                          type: string
                          description: Owner's name.
                          example: William Wilson
                    priority:
                      type: integer
                      format: int64
                      description: Identity profile's priority.
                      example: 10
                    authoritativeSource:
