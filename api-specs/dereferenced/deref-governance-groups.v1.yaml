  /workgroups/v1/bulk-delete:
    post:
      security:
      - userAuth:
        - idn:workgroup:manage
      - applicationAuth:
        - idn:workgroup:manage
      x-sailpoint-userLevels:
      - ORG_ADMIN
      operationId: deleteWorkgroupsInBulkV1
      tags:
      - Governance Groups
      summary: Delete governance group(s)
      description: "\nThis API initiates a bulk deletion of one or more Governance Groups.\n\n>  If any of the indicated Governance Groups have one or more connections associated with it,then those Governance Groups will be added in  **inUse** list of the response. Governance Group(s) marked as **inUse** can not be deleted.\n\n>  If any of the indicated Governance Groups is not does not exists in Organization,then those Governance Groups will be added in **notFound** list of the response. Governance Groups marked as **notFound** will not be deleted.\n\n>  If any of the indicated Governance Groups does not have any connections associated with it,then those Governance Groups will be added in **deleted** list of the response. A Governance Group marked as **deleted** will be deleted from current Organization.\n\n>  If the request contains any **inUse** or **notFound** Governance Group IDs then it skips only these Governance Groups for deletion and deletes the rest of Governance Groups which\
        \ have no connections associated with it. \n\n>  **This API has limit number of Governance Groups can be deleted at one time. If the request contains more then 100 Governance Groups IDs to be deleted then the API will throw an exception.**"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  description: List of IDs of Governance Groups to be deleted.
                  type: array
                  items:
                    type: string
                  example:
                  - 567a697e-885b-495a-afc5-d55e1c23a302
                  - c7b0f7b2-1e78-4063-b294-a555333dacd2
            example:
              ids:
              - 567a697e-885b-495a-afc5-d55e1c23a302
              - c7b0f7b2-1e78-4063-b294-a555333dacd2
