                          description: Owner's identity ID.
                          example: 2c9180a46faadee4016fb4e018c20639
                        name:
                          type: string
                          description: Owner's name.
                          example: Support
                        displayName:
                          readOnly: true
                          description: The display name of the identity
                          type: string
                          example: Support
                        emailAddress:
                          readOnly: true
                          description: The primary email address of the identity
                          type: string
