openapi: 3.0.1
info:
  title: Identity Security Cloud API - Identities
  description: Use these APIs to interact with the Identity Security Cloud platform
    to achieve repeatable, automated processes with greater scalability. We encourage
    you to join the SailPoint Developer Community forum at https://developer.sailpoint.com/discuss
    to connect with other developers using our APIs.
  termsOfService: https://developer.sailpoint.com/discuss/tos
  contact:
    name: Developer Relations
    url: https://developer.sailpoint.com/discuss/api-help
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: v1
servers:
- url: https://{tenant}.api.identitynow.com
  description: This is the production API server.
  variables:
    tenant:
      default: sailpoint
      description: This is the name of your tenant, typically your company's name.
- url: https://{apiUrl}
  description: This is the versioned API server.
  variables:
    apiUrl:
      default: sailpoint.api.identitynow.com
      description: This is the api url of your tenant
tags:
- name: Identities
  description: 'Use this API to implement identity functionality.

    With this functionality in place, administrators can synchronize an identity''s
    attributes with its various source attributes.


    Identity Security Cloud uses identities as users'' authoritative accounts. Identities
    can own other accounts, entitlements, and attributes.


    An identity has a variety of attributes, such as an account name, an email address,
    a job title, and more.

    These identity attributes can be correlated with different attributes on different
    sources.

    For example, the identity John.Smith can own an account in the GitHub source with
    the account name John-Smith-Org, and Identity Security Cloud knows they are the
    same person with the same access and attributes.


    In Identity Security Cloud, administrators often set up these synchronizations
    to get triggered automatically with a change or to run on a schedule.

    To manually synchronize attributes for an identity, administrators can use the
    Identities drop-down menu and select Identity List to view the list of identities.

    They can then select the identity they want to manually synchronize and use the
    hamburger menu to select ''Synchronize Attributes.''

    Doing so immediately begins the attribute synchronization and analyzes all accounts
    for the selected identity.


    Refer to [Synchronizing Attributes](https://documentation.sailpoint.com/saas/help/provisioning/attr_sync.html)
    for more information about synchronizing attributes.

    '
paths:
  /identities/v1:
    get:
      operationId: listIdentitiesV1
      tags:
      - Identities
      summary: List identities
      description: This API returns a list of identities.
      security:
      - userAuth:
        - idn:identity:read
        - idn:identity:manage
      parameters:
      - in: query
        name: filters
        schema:
          type: string
        required: false
        description: 'Filter results using the standard syntax described in [V3 API
          Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


          Filtering is supported for the following fields and operators:


          **id**: *eq, in*


          **name**: *eq, sw*


          **alias**: *eq, sw*


          **firstname**: *eq, sw*


          **lastname**: *eq, sw*


          **email**: *eq, sw*


          **cloudStatus**: *eq*


          **processingState**: *eq*


          **correlated**: *eq*


          **protected**: *eq*'
        example: id eq "6c9079b270a266a60170a2779fcb0006" or correlated eq false
      - in: query
        name: sorters
        schema:
          type: string
          format: comma-separated
        required: false
        description: 'Sort results using the standard syntax described in [V3 API
          Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


          Sorting is supported for the following fields: **name, alias, cloudStatus**'
        example: name,-cloudStatus
      - in: query
        name: defaultFilter
        schema:
          type: string
          enum:
          - CORRELATED_ONLY
          - NONE
          default: CORRELATED_ONLY
        required: false
        description: 'Adds additional filter to filters query parameter.


          CORRELATED_ONLY adds correlated=true and returns only identities that are
          correlated.


          NONE does not add any and returns all identities that satisfy filters query
          parameter.'
        example: NONE
      - in: query
        name: count
        description: 'If *true* it will populate the *X-Total-Count* response header
          with the number of results that would be returned if *limit* and *offset*
          were ignored.


          Since requesting a total count can have a performance impact, it is recommended
          not to send **count=true** if that value will not be used.


          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: true
        schema:
          type: boolean
          default: false
      - in: query
        name: limit
        description: 'Max number of results to return.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: 250
        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 250
          default: 250
      - in: query
        name: offset
        description: 'Offset into the full result set. Usually specified with *limit*
          to paginate through the results.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: 0
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      responses:
        '200':
          description: List of identities.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: IdentityDto
                  required:
                  - name
                  properties:
                    id:
                      description: System-generated unique ID of the identity
                      type: string
                      example: 01f04e428c484542a241dc89c303b178
                      readOnly: true
                    name:
                      description: The identity's name is equivalent to its Display
                        Name attribute.
                      type: string
                      example: Walter White
                    created:
                      description: Creation date of the identity
                      type: string
                      format: date-time
                      readOnly: true
                      example: '2023-01-03T21:16:22.432Z'
                    modified:
                      description: Last modification date of the identity
                      type: string
                      format: date-time
                      readOnly: true
                      example: '2023-01-03T21:16:22.432Z'
                    alias:
                      type: string
                      description: The identity's alternate unique identifier is equivalent
                        to its Account Name on the authoritative source account schema.
                      example: walter.white
                    emailAddress:
                      type: string
                      description: The email address of the identity
                      example: walter.white@example.com
                      nullable: true
                    processingState:
                      type: string
                      nullable: true
                      description: The processing state of the identity
                      enum:
                      - ERROR
                      - OK
                      - null
                      example: ERROR
                    identityStatus:
                      type: string
                      description: The identity's status in the system
                      enum:
                      - UNREGISTERED
                      - REGISTERED
                      - PENDING
                      - WARNING
                      - DISABLED
                      - ACTIVE
                      - DEACTIVATED
                      - TERMINATED
                      - ERROR
                      - LOCKED
                      example: LOCKED
                    managerRef:
                      type: object
                      description: Identity's manager
                      nullable: true
                      properties:
                        type:
                          type: string
                          description: DTO type of identity's manager
                          enum:
                          - IDENTITY
                          example: IDENTITY
                        id:
                          type: string
                          description: ID of identity's manager
                          example: 2c4180a46faadee4016fb4e018c20626
                        name:
                          type: string
                          description: Human-readable display name of identity's manager
                          example: Robert Robinson
                    isManager:
                      type: boolean
                      description: Whether this identity is a manager of another identity
                      default: false
                      example: true
                    lastRefresh:
                      type: string
                      format: date-time
                      description: The last time the identity was refreshed by the
                        system
                      example: '2020-11-22T15:42:31.123Z'
                    attributes:
                      type: object
                      description: A map with the identity attributes for the identity
                      example:
                        uid: '86754'
                        firstname: Walter
                        cloudStatus: UNREGISTERED
                        displayName: Walter White
                        identificationNumber: '86754'
                        lastSyncDate: 1470348809380
                        email: walter.white@example.com
                        lastname: White
                    lifecycleState:
                      type: object
                      title: Lifecycle State Dto
                      nullable: true
                      description: Lifecycle state details that include lifecycle
                        state name and whether this lifecycle state has been set manually
                      properties:
                        stateName:
                          type: string
                          description: The name of the lifecycle state
                          example: active
                        manuallyUpdated:
                          type: boolean
                          description: Whether the lifecycle state has been manually
                            or automatically set
                          example: true
                      required:
                      - stateName
                      - manuallyUpdated
        '400':
          description: Client Error - Returned if the request body is invalid.
          content:
            application/json:
              schema:
