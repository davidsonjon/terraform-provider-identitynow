                    enum:
                    - UNREGISTERED
                    - REGISTERED
                    - PENDING
                    - WARNING
                    - DISABLED
                    - ACTIVE
                    - DEACTIVATED
                    - TERMINATED
                    - ERROR
                    - LOCKED
