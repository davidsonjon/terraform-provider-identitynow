  /identities/v1/{identityId}/role-assignments:
    get:
      operationId: getRoleAssignmentsV1
      tags:
      - Identities
      summary: List role assignments
      description: This returns either a list of Role Assignments when querying with
        either a Role Id or Role Name, or a list of Role Assignment References if
        querying with only identity Id.
      security:
      - userAuth:
        - idn:identity:read
        - idn:identity-direct-report:read
        - idn:identity:manage
      parameters:
      - in: path
        name: identityId
        schema:
          type: string
        required: true
        x-sailpoint-resource-operation-id: listIdentitiesV1
        description: Identity Id to get the role assignments for
        example: ef38f94347e94562b5bb8424a56397d8
      - in: query
        name: roleId
        schema:
          type: string
        required: false
        description: Role Id to filter the role assignments with
        example: e7697a1e96d04db1ac7b0f4544915d2c
      - in: query
        name: roleName
        schema:
          type: string
        required: false
        description: Role name to filter the role assignments with
        example: Engineer
      responses:
        '200':
          description: A role assignment object
          content:
            application/json:
              schema:
                type: array
                items:
                  anyOf:
                  - type: object
                    title: Role Assignment Ref
                    properties:
                      id:
                        type: string
                        description: Assignment Id
                        example: 1cbb0705b38c4226b1334eadd8874086
                      role:
                        description: Role Id and Name related to this assignment
                        example:
                          id: e7697a1e96d04db1ac7b0f4544915d2c
                          type: ROLE
                          name: Engineer
                        type: object
                        title: Base Reference Dto
                        properties:
                          type:
                            description: DTO type
                            type: string
                            enum:
                            - ACCOUNT_CORRELATION_CONFIG
                            - ACCESS_PROFILE
                            - ACCESS_REQUEST_APPROVAL
                            - ACCOUNT
                            - APPLICATION
                            - CAMPAIGN
                            - CAMPAIGN_FILTER
                            - CERTIFICATION
                            - CLUSTER
                            - CONNECTOR_SCHEMA
                            - ENTITLEMENT
                            - GOVERNANCE_GROUP
                            - IDENTITY
