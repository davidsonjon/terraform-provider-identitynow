                        name:
                          type: string
                          nullable: true
                          description: Human-readable display name of the object this
                            reference applies to
                          example: William Wilson
                    tags:
                      type: array
                      items:
                        type: string
                      description: Labels to be applied to object.
                      example:
                      - BU_FINANCE
                      - PCI
