                            - IDENTITY_REQUEST
                            - MACHINE_IDENTITY
                            - LIFECYCLE_STATE
                            - PASSWORD_POLICY
                            - ROLE
                            - RULE
                            - SOD_POLICY
                            - SOURCE
                            - TAG
                            - TAG_CATEGORY
                            - TASK_RESULT
                            - REPORT_RESULT
                            - SOD_VIOLATION
                            - ACCOUNT_ACTIVITY
                            - WORKGROUP
                            example: IDENTITY
                          id:
                            type: string
                            description: ID of the object to which this reference
                              applies
                            example: 2c91808568c529c60168cca6f90c1313
                          name:
                            type: string
                            description: Human-readable display name of the object
                              to which this reference applies
                            example: William Wilson
                      addedDate:
                        type: string
                        format: date-time
                        description: Date that the assignment was added
                        example: '2025-07-11T18:45:37.098Z'
                      startDate:
                        type: string
                        format: date-time
                        nullable: true
                        description: Date when assignment will be active, if requested
                          with a future date. If null, assignment is active immediately
                        example: '2026-01-22T19:15:00.000Z'
                      removeDate:
                        type: string
                        format: date-time
                        nullable: true
                        description: Date that the assignment will be removed
                        example: '2026-01-23T19:15:00.000Z'
                  - type: object
                    title: Role Assignment Dto
                    properties:
