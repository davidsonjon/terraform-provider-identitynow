  /entitlements/v1/identities/{id}/entitlements:
    get:
      operationId: listEntitlementsByIdentityV1
      tags:
      - Identities
      summary: List of entitlements by identity.
      description: The API returns a list of all entitlements assigned to an identity,
        either directly or through the role or access profile. A token with ORG_ADMIN
        or API authority is required to call this API.
      parameters:
      - in: query
        name: limit
        description: 'Max number of results to return.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: 250
        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 250
          default: 250
      - in: query
        name: offset
        description: 'Offset into the full result set. Usually specified with *limit*
          to paginate through the results.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: 0
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - in: query
        name: count
        description: 'If *true* it will populate the *X-Total-Count* response header
          with the number of results that would be returned if *limit* and *offset*
          were ignored.


          Since requesting a total count can have a performance impact, it is recommended
          not to send **count=true** if that value will not be used.


          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: true
        schema:
          type: boolean
          default: false
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: Identity Id
        example: ef38f94347e94562b5bb8424a56397d8
        x-sailpoint-resource-operation-id: listIdentitiesV1
