  /identities/v1/invite:
    post:
      operationId: startIdentitiesInviteV1
      tags:
      - Identities
      summary: Invite identities to register
      description: 'This API submits a task for inviting given identities via email
        to complete registration. The invitation email will include the link. After
        selecting the link an identity will be able to set up password and log in
        into the system. Invitations expire after 7 days. By default invitations send
        to the work identity email. It can be changed in Admin > Identities > Identity
        Profiles by selecting corresponding profile and editing Invitation Options.


        This task will send an invitation email only for unregistered identities.


        The executed task status can be checked by Task Management > [Get task status
        by ID](https://developer.sailpoint.com/docs/api/get-task-status-v-1).

        '
      externalDocs:
        description: Learn more about inviting identities here
        url: https://documentation.sailpoint.com/saas/help/common/users/inviting_users.html
      security:
      - userAuth:
        - idn:password-user-invite:manage
      x-sailpoint-userLevels:
      - ORG_ADMIN
      - HELPDESK
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: Invite Identities Request
              properties:
                ids:
                  description: The list of Identities IDs to invite - required when
                    'uninvited' is false
                  type: array
                  items:
                    type: string
                  nullable: true
                  example:
                  - 2b568c65bc3c4c57a43bd97e3a8e55
                  - 2c9180867769897d01776ed5f125512f
                uninvited:
                  description: indicator (optional) to invite all unregistered identities
                    in the system within a limit 1000. This parameter makes sense
                    only when 'ids' is empty.
                  type: boolean
                  default: false
                  example: false
      responses:
        '202':
          description: Responds with an initial TaskStatus for the executed task
          content:
            application/json:
              schema:
                description: Details and current status of a specific task
                required:
                - id
                - type
                - uniqueName
                - description
                - parentName
                - attributes
                - created
                - modified
                - launched
                - launcher
                - completed
                - completionStatus
                - messages
                - progress
                - percentComplete
                - returns
                type: object
                title: Task Status
                properties:
                  id:
                    description: System-generated unique ID of the task this TaskStatus
                      represents
                    type: string
                    example: id12345
                  type:
                    description: Type of task this TaskStatus represents
                    type: string
                    enum:
                    - QUARTZ
                    - QPOC
                    - QUEUED_TASK
                    example: QUARTZ
                  uniqueName:
                    description: Name of the task this TaskStatus represents
                    type: string
                    example: Big Task
                  description:
                    description: Description of the task this TaskStatus represents
                    type: string
                    example: A Really Big Task
                  parentName:
                    description: Name of the parent of the task this TaskStatus represents
                    nullable: true
                    type: string
                    example: Parent Task
                  launcher:
                    description: Service to execute the task this TaskStatus represents
                    type: string
                    example: sweep
                  target:
                    type: object
                    title: Target
                    nullable: true
                    properties:
                      id:
                        description: Target ID
                        type: string
                        example: c6dc37bf508149b28ce5b7d90ca4bbf9
                      type:
                        description: Target type
                        type: string
                        nullable: true
                        enum:
                        - APPLICATION
                        - IDENTITY
                        - null
                        example: APPLICATION
                      name:
                        description: Target name
                        type: string
                        example: Active Directory [source]
                  created:
                    description: Creation date of the task this TaskStatus represents
                    type: string
                    format: date-time
                    example: '2020-07-11T21:23:15.000Z'
                  modified:
                    description: Last modification date of the task this TaskStatus
                      represents
                    nullable: true
                    type: string
                    format: date-time
                    example: '2020-07-11T21:23:15.000Z'
                  launched:
                    description: Launch date of the task this TaskStatus represents
                    nullable: true
                    type: string
                    format: date-time
                    example: '2020-07-11T21:23:15.000Z'
                  completed:
                    description: Completion date of the task this TaskStatus represents
                    nullable: true
                    type: string
                    format: date-time
                    example: '2020-07-11T21:23:15.000Z'
                  completionStatus:
                    description: Completion status of the task this TaskStatus represents
                    type: string
                    nullable: true
                    enum:
                    - SUCCESS
                    - WARNING
                    - ERROR
                    - TERMINATED
                    - TEMPERROR
                    - null
                    example: SUCCESS
                  messages:
                    description: Messages associated with the task this TaskStatus
