openapi: 3.0.1
info:
  title: Identity Security Cloud API - SOD Policies
  description: Use these APIs to interact with the Identity Security Cloud platform
    to achieve repeatable, automated processes with greater scalability. We encourage
    you to join the SailPoint Developer Community forum at https://developer.sailpoint.com/discuss
    to connect with other developers using our APIs.
  termsOfService: https://developer.sailpoint.com/discuss/tos
  contact:
    name: Developer Relations
    url: https://developer.sailpoint.com/discuss/api-help
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: v1
servers:
- url: https://{tenant}.api.identitynow.com
  description: This is the production API server.
  variables:
    tenant:
      default: sailpoint
      description: This is the name of your tenant, typically your company's name.
- url: https://{apiUrl}
  description: This is the versioned API server.
  variables:
    apiUrl:
      default: sailpoint.api.identitynow.com
      description: This is the api url of your tenant
tags:
- name: SOD Policies
  description: "Use this API to implement and manage \"separation of duties\" (SOD)\
    \ policies. \nWith SOD policy functionality in place, administrators can organize\
    \ the access in their tenants to prevent individuals from gaining conflicting\
    \ or excessive access. \n\n\"Separation of duties\" refers to the concept that\
    \ people shouldn't have conflicting sets of access - all their access should be\
    \ configured in a way that protects your organization's assets and data.  \nFor\
    \ example, people who record monetary transactions shouldn't be able to issue\
    \ payment for those transactions.\nAny changes to major system configurations\
    \ should be approved by someone other than the person requesting the change. \n\
    \nOrganizations can use \"separation of duties\" (SOD) policies to enforce and\
    \ track their internal security rules throughout their tenants.\nThese SOD policies\
    \ limit each user's involvement in important processes and protects the organization\
    \ from individuals gaining excessive access. \n\nTo create SOD policies in Identity\
    \ Security Cloud, administrators use 'Search' and then access 'Policies'.\nTo\
    \ create a policy, they must configure two lists of access items. Each access\
    \ item can only be added to one of the two lists.\nThey can search for the entitlements\
    \ they want to add to these access lists.\n\n>Note: You can have a maximum of\
    \ 500 policies of any type (including general policies) in your organization.\
    \ In each access-based SOD policy, you can have a maximum of 50 entitlements in\
    \ each access list.  \n\nOnce a SOD policy is in place, if an identity has access\
    \ items on both lists, a SOD violation will trigger. \nThese violations are included\
    \ in SOD violation reports that other users will see in emails at regular intervals\
    \ if they're subscribed to the SOD policy.\nThe other users can then better help\
    \ to enforce these SOD policies. \n\nTo create a subscription to a SOD policy\
    \ in Identity Security Cloud, administrators use 'Search' and then access 'Layers'.\n\
    They can create a subscription to the policy and schedule it to run at a regular\
    \ interval. \n\nRefer to [Managing Policies](https://documentation.sailpoint.com/saas/help/sod/manage-policies.html)\
    \ for more information about SOD policies. \n\nRefer to [Subscribe to a SOD Policy](https://documentation.sailpoint.com/saas/help/sod/policy-violations.html#subscribe-to-an-sod-policy)\
    \ for more information about SOD policy subscriptions.\n"
paths:
  /sod-policies/v1:
    post:
      security:
      - userAuth:
        - idn:sod-policy:manage
      operationId: createSodPolicyV1
      tags:
      - SOD Policies
      summary: Create sod policy
      description: 'This creates both General and Conflicting Access Based policy,
        with a limit of 50 entitlements for each (left & right) criteria for Conflicting
        Access Based SOD policy.

        Requires role of ORG_ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: Sod Policy
              properties:
                id:
                  type: string
                  description: Policy id
                  example: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
                  readOnly: true
                name:
                  type: string
                  description: Policy Business Name
                  example: policy-xyz
                created:
                  type: string
                  format: date-time
                  description: The time when this SOD policy is created.
                  example: '2020-01-01T00:00:00.000000Z'
                  readOnly: true
                modified:
                  type: string
                  format: date-time
                  description: The time when this SOD policy is modified.
                  example: '2020-01-01T00:00:00.000000Z'
                  readOnly: true
                description:
                  type: string
                  description: Optional description of the SOD policy
                  example: This policy ensures compliance of xyz
                  nullable: true
                ownerRef:
                  type: object
                  description: The owner of the SOD policy.
                  properties:
                    type:
                      type: string
                      description: Owner type.
                      enum:
                      - IDENTITY
                      - GOVERNANCE_GROUP
                      example: IDENTITY
                    id:
                      type: string
                      description: Owner's ID.
                      example: 2c9180a46faadee4016fb4e018c20639
                    name:
                      type: string
                      description: Owner's name.
                      example: Support
                externalPolicyReference:
                  type: string
                  description: Optional External Policy Reference
                  example: XYZ policy
                  nullable: true
                policyQuery:
                  type: string
                  description: Search query of the SOD policy
                  example: '@access(id:0f11f2a4-7c94-4bf3-a2bd-742580fe3bdg) AND @access(id:0f11f2a4-7c94-4bf3-a2bd-742580fe3bdf)'
                compensatingControls:
                  type: string
                  description: Optional compensating controls(Mitigating Controls)
                  example: Have a manager review the transaction decisions for their
                    "out of compliance" employee
                  nullable: true
                correctionAdvice:
                  type: string
                  description: Optional correction advice
                  example: Based on the role of the employee, managers should remove
                    access that is not required for their job function.
                  nullable: true
                state:
                  type: string
                  description: whether the policy is enforced or not
                  enum:
                  - ENFORCED
                  - NOT_ENFORCED
                  example: ENFORCED
                tags:
                  type: array
                  description: tags for this policy object
                  example:
                  - TAG1
                  - TAG2
                  items:
                    type: string
                creatorId:
                  type: string
                  description: Policy's creator ID
                  example: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
                  readOnly: true
                modifierId:
                  type: string
                  description: Policy's modifier ID
                  example: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
                  nullable: true
                  readOnly: true
                violationOwnerAssignmentConfig:
                  nullable: true
                  type: object
                  title: Violation Owner Assignment Config
                  properties:
                    assignmentRule:
                      type: string
                      enum:
                      - MANAGER
                      - STATIC
                      - null
                      description: 'Details about the violations owner.

                        MANAGER - identity''s manager

                        STATIC - Governance Group or Identity'
                      example: MANAGER
                      nullable: true
                    ownerRef:
                      type: object
                      description: The owner of the violation assignment config.
                      nullable: true
                      properties:
                        type:
                          type: string
                          description: Owner type.
                          enum:
                          - IDENTITY
                          - GOVERNANCE_GROUP
                          - MANAGER
                          - null
                          example: IDENTITY
                        id:
                          type: string
                          description: Owner's ID.
                          example: 2c9180a46faadee4016fb4e018c20639
                        name:
                          type: string
                          description: Owner's name.
                          example: Support
                scheduled:
                  type: boolean
                  description: defines whether a policy has been scheduled or not
                  example: true
                  default: false
                type:
                  type: string
                  description: whether a policy is query based or conflicting access
                    based
                  default: GENERAL
                  enum:
                  - GENERAL
                  - CONFLICTING_ACCESS_BASED
                  example: GENERAL
                conflictingAccessCriteria:
                  type: object
                  title: Conflicting Access Criteria
                  nullable: true
                  properties:
                    leftCriteria:
                      type: object
                      title: Access Criteria
                      properties:
                        name:
                          type: string
                          description: Business name for the access construct list
                          example: money-in
                        criteriaList:
                          type: array
                          description: List of criteria. There is a min of 1 and max
                            of 50 items in the list.
                          minItems: 1
                          maxItems: 50
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                enum:
                                - ENTITLEMENT
                                description: Type of the propery to which this reference
                                  applies to
                                example: ENTITLEMENT
                              id:
                                type: string
                                description: ID of the object to which this reference
                                  applies to
                                example: 2c91808568c529c60168cca6f90c1313
                              name:
                                type: string
                                description: Human-readable display name of the object
                                  to which this reference applies to
                                example: Administrator
                          example:
                          - type: ENTITLEMENT
                            id: 2c9180866166b5b0016167c32ef31a66
                            name: Administrator
                          - type: ENTITLEMENT
                            id: 2c9180866166b5b0016167c32ef31a67
                            name: Administrator
                    rightCriteria:
                      type: object
                      title: Access Criteria
                      properties:
                        name:
                          type: string
                          description: Business name for the access construct list
                          example: money-in
                        criteriaList:
                          type: array
                          description: List of criteria. There is a min of 1 and max
                            of 50 items in the list.
                          minItems: 1
                          maxItems: 50
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                enum:
                                - ENTITLEMENT
                                description: Type of the propery to which this reference
                                  applies to
                                example: ENTITLEMENT
                              id:
                                type: string
                                description: ID of the object to which this reference
                                  applies to
                                example: 2c91808568c529c60168cca6f90c1313
                              name:
                                type: string
                                description: Human-readable display name of the object
                                  to which this reference applies to
                                example: Administrator
                          example:
                          - type: ENTITLEMENT
                            id: 2c9180866166b5b0016167c32ef31a66
                            name: Administrator
                          - type: ENTITLEMENT
                            id: 2c9180866166b5b0016167c32ef31a67
                            name: Administrator
            examples:
              Conflicting Access Based Policy:
                value:
                  name: Conflicting-Policy-Name
                  description: This policy ensures compliance of xyz
                  ownerRef:
                    type: IDENTITY
                    id: 2c91808568c529c60168cca6f90c1313
                    name: Owner Name
                  externalPolicyReference: XYZ policy
                  compensatingControls: Have a manager review the transaction decisions
                    for their "out of compliance" employee
                  correctionAdvice: Based on the role of the employee, managers should
                    remove access that is not required for their job function.
                  state: ENFORCED
                  tags:
                  - string
                  creatorId: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
                  modifierId: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
                  violationOwnerAssignmentConfig:
                    assignmentRule: MANAGER
                    ownerRef:
                      type: IDENTITY
                      id: 2c91808568c529c60168cca6f90c1313
                      name: Violation Owner Name
                  scheduled: true
                  type: CONFLICTING_ACCESS_BASED
                  conflictingAccessCriteria:
                    leftCriteria:
                      name: money-in
                      criteriaList:
                      - type: ENTITLEMENT
                        id: 2c9180866166b5b0016167c32ef31a66
                      - type: ENTITLEMENT
                        id: 2c9180866166b5b0016167c32ef31a67
                    rightCriteria:
                      name: money-out
                      criteriaList:
                      - type: ENTITLEMENT
                        id: 2c9180866166b5b0016167c32ef31a68
                      - type: ENTITLEMENT
                        id: 2c9180866166b5b0016167c32ef31a69
              General Policy:
                value:
                  description: Description
                  ownerRef:
                    type: IDENTITY
                    id: 2c918087682f9a86016839c05e8f1aff
                    name: Owner Name
                  externalPolicyReference: New policy
                  policyQuery: policy query implementation
                  compensatingControls: Compensating controls
                  correctionAdvice: Correction advice
                  tags: []
                  state: ENFORCED
                  scheduled: false
                  creatorId: 2c918087682f9a86016839c05e8f1aff
                  modifierId: null
                  violationOwnerAssignmentConfig: null
                  name: General-Policy-Name
      responses:
        '201':
          description: SOD policy created
          content:
            application/json:
              schema:
                type: object
                title: Sod Policy
                properties:
                  id:
                    type: string
                    description: Policy id
                    example: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
                    readOnly: true
                  name:
                    type: string
                    description: Policy Business Name
                    example: policy-xyz
                  created:
                    type: string
                    format: date-time
                    description: The time when this SOD policy is created.
                    example: '2020-01-01T00:00:00.000000Z'
                    readOnly: true
                  modified:
                    type: string
                    format: date-time
                    description: The time when this SOD policy is modified.
                    example: '2020-01-01T00:00:00.000000Z'
                    readOnly: true
                  description:
                    type: string
                    description: Optional description of the SOD policy
                    example: This policy ensures compliance of xyz
                    nullable: true
                  ownerRef:
                    type: object
                    description: The owner of the SOD policy.
                    properties:
                      type:
                        type: string
                        description: Owner type.
                        enum:
                        - IDENTITY
                        - GOVERNANCE_GROUP
                        example: IDENTITY
                      id:
                        type: string
                        description: Owner's ID.
                        example: 2c9180a46faadee4016fb4e018c20639
                      name:
                        type: string
                        description: Owner's name.
                        example: Support
                  externalPolicyReference:
                    type: string
                    description: Optional External Policy Reference
                    example: XYZ policy
                    nullable: true
                  policyQuery:
                    type: string
                    description: Search query of the SOD policy
                    example: '@access(id:0f11f2a4-7c94-4bf3-a2bd-742580fe3bdg) AND
                      @access(id:0f11f2a4-7c94-4bf3-a2bd-742580fe3bdf)'
                  compensatingControls:
                    type: string
                    description: Optional compensating controls(Mitigating Controls)
                    example: Have a manager review the transaction decisions for their
                      "out of compliance" employee
                    nullable: true
                  correctionAdvice:
                    type: string
                    description: Optional correction advice
                    example: Based on the role of the employee, managers should remove
                      access that is not required for their job function.
                    nullable: true
                  state:
                    type: string
                    description: whether the policy is enforced or not
                    enum:
                    - ENFORCED
                    - NOT_ENFORCED
                    example: ENFORCED
                  tags:
                    type: array
                    description: tags for this policy object
                    example:
                    - TAG1
                    - TAG2
                    items:
                      type: string
                  creatorId:
                    type: string
                    description: Policy's creator ID
                    example: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
                    readOnly: true
                  modifierId:
                    type: string
                    description: Policy's modifier ID
                    example: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
                    nullable: true
                    readOnly: true
                  violationOwnerAssignmentConfig:
                    nullable: true
                    type: object
                    title: Violation Owner Assignment Config
                    properties:
                      assignmentRule:
                        type: string
                        enum:
                        - MANAGER
                        - STATIC
                        - null
                        description: 'Details about the violations owner.

                          MANAGER - identity''s manager

                          STATIC - Governance Group or Identity'
                        example: MANAGER
                        nullable: true
                      ownerRef:
                        type: object
                        description: The owner of the violation assignment config.
                        nullable: true
                        properties:
                          type:
                            type: string
                            description: Owner type.
                            enum:
                            - IDENTITY
                            - GOVERNANCE_GROUP
                            - MANAGER
                            - null
                            example: IDENTITY
                          id:
                            type: string
                            description: Owner's ID.
                            example: 2c9180a46faadee4016fb4e018c20639
                          name:
                            type: string
                            description: Owner's name.
                            example: Support
                  scheduled:
                    type: boolean
                    description: defines whether a policy has been scheduled or not
                    example: true
                    default: false
                  type:
                    type: string
                    description: whether a policy is query based or conflicting access
                      based
                    default: GENERAL
                    enum:
                    - GENERAL
                    - CONFLICTING_ACCESS_BASED
                    example: GENERAL
                  conflictingAccessCriteria:
                    type: object
                    title: Conflicting Access Criteria
                    nullable: true
                    properties:
                      leftCriteria:
                        type: object
                        title: Access Criteria
                        properties:
                          name:
                            type: string
                            description: Business name for the access construct list
                            example: money-in
                          criteriaList:
                            type: array
                            description: List of criteria. There is a min of 1 and
                              max of 50 items in the list.
                            minItems: 1
                            maxItems: 50
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - ENTITLEMENT
                                  description: Type of the propery to which this reference
                                    applies to
                                  example: ENTITLEMENT
                                id:
                                  type: string
                                  description: ID of the object to which this reference
                                    applies to
                                  example: 2c91808568c529c60168cca6f90c1313
                                name:
                                  type: string
                                  description: Human-readable display name of the
                                    object to which this reference applies to
                                  example: Administrator
                            example:
                            - type: ENTITLEMENT
                              id: 2c9180866166b5b0016167c32ef31a66
                              name: Administrator
                            - type: ENTITLEMENT
                              id: 2c9180866166b5b0016167c32ef31a67
                              name: Administrator
                      rightCriteria:
                        type: object
                        title: Access Criteria
                        properties:
                          name:
                            type: string
                            description: Business name for the access construct list
                            example: money-in
                          criteriaList:
                            type: array
                            description: List of criteria. There is a min of 1 and
                              max of 50 items in the list.
                            minItems: 1
                            maxItems: 50
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
