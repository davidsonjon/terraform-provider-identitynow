    patch:
      security:
      - userAuth:
        - idn:sod-policy:manage
      operationId: patchSodPolicyV1
      tags:
      - SOD Policies
      summary: Patch sod policy by id
      description: 'Allows updating SOD Policy fields other than ["id","created","creatorId","policyQuery","type"]
        using the [JSON Patch](https://tools.ietf.org/html/rfc6902) standard.

        Requires role of ORG_ADMIN.

        This endpoint can only patch CONFLICTING_ACCESS_BASED type policies. Do not
        use this endpoint to patch general policies - doing so will build an API exception. '
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        x-sailpoint-resource-operation-id: listSodPoliciesV1
        description: The ID of the SOD policy being modified.
        example: 2c918083-5d19-1a86-015d-28455b4a2329
      requestBody:
        required: true
        description: 'A list of SOD Policy update operations according to the [JSON
          Patch](https://tools.ietf.org/html/rfc6902) standard.


          The following fields are patchable:

          * name

          * description

          * ownerRef

          * externalPolicyReference

          * compensatingControls

          * correctionAdvice

          * state

          * tags

          * violationOwnerAssignmentConfig

          * scheduled

          * conflictingAccessCriteria

          '
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                type: object
                title: Json Patch Operation
                description: A JSONPatch Operation as defined by [RFC 6902 - JSON
                  Patch](https://tools.ietf.org/html/rfc6902)
                required:
                - op
                - path
                properties:
                  op:
                    type: string
                    description: The operation to be performed
                    enum:
                    - add
                    - remove
                    - replace
                    - move
                    - copy
                    - test
                    example: replace
                  path:
                    type: string
                    description: A string JSON Pointer representing the target path
                      to an element to be affected by the operation
                    example: /description
                  value:
                    oneOf:
                    - type: string
                      example: New description
                      title: string
                    - type: boolean
                      example: true
                      title: boolean
                    - type: integer
                      example: 300
                      title: integer
                    - type: object
                      title: object
                      example:
                        attributes:
                          name: philip
                    - type: array
                      title: array
                      items:
                        anyOf:
                        - type: string
                        - type: integer
                        - type: object
                        example:
                        - '001'
                        - '002'
                        - '003'
                    description: The value to be used for the operation, required
                      for "add" and "replace" operations
                    example: New description
            examples:
              Conflicting Access Based Policy:
                value:
                - op: replace
                  path: /description
                  value: Modified description
                - op: replace
                  path: /conflictingAccessCriteria/leftCriteria/name
                  value: money-in-modified
                - op: replace
                  path: /conflictingAccessCriteria/rightCriteria
                  value:
                    name: money-out-modified
                    criteriaList:
                    - type: ENTITLEMENT
                      id: 2c918087682f9a86016839c0509c1ab2
              General Policy:
                value:
                - op: replace
                  path: /description
                  value: Modified description
      responses:
        '200':
          description: Indicates the PATCH operation succeeded, and returns the SOD
            policy's new representation.
          content:
            application/json:
              schema:
                type: object
                title: Sod Policy
                properties:
                  id:
                    type: string
                    description: Policy id
                    example: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
                    readOnly: true
                  name:
                    type: string
                    description: Policy Business Name
                    example: policy-xyz
                  created:
                    type: string
                    format: date-time
                    description: The time when this SOD policy is created.
                    example: '2020-01-01T00:00:00.000000Z'
                    readOnly: true
                  modified:
                    type: string
                    format: date-time
                    description: The time when this SOD policy is modified.
                    example: '2020-01-01T00:00:00.000000Z'
                    readOnly: true
                  description:
                    type: string
                    description: Optional description of the SOD policy
                    example: This policy ensures compliance of xyz
                    nullable: true
                  ownerRef:
                    type: object
                    description: The owner of the SOD policy.
                    properties:
                      type:
                        type: string
                        description: Owner type.
                        enum:
                        - IDENTITY
                        - GOVERNANCE_GROUP
                        example: IDENTITY
                      id:
                        type: string
                        description: Owner's ID.
                        example: 2c9180a46faadee4016fb4e018c20639
                      name:
                        type: string
                        description: Owner's name.
                        example: Support
                  externalPolicyReference:
                    type: string
                    description: Optional External Policy Reference
                    example: XYZ policy
                    nullable: true
                  policyQuery:
                    type: string
                    description: Search query of the SOD policy
                    example: '@access(id:0f11f2a4-7c94-4bf3-a2bd-742580fe3bdg) AND
                      @access(id:0f11f2a4-7c94-4bf3-a2bd-742580fe3bdf)'
                  compensatingControls:
                    type: string
                    description: Optional compensating controls(Mitigating Controls)
                    example: Have a manager review the transaction decisions for their
                      "out of compliance" employee
                    nullable: true
                  correctionAdvice:
                    type: string
                    description: Optional correction advice
                    example: Based on the role of the employee, managers should remove
                      access that is not required for their job function.
                    nullable: true
                  state:
                    type: string
                    description: whether the policy is enforced or not
                    enum:
                    - ENFORCED
                    - NOT_ENFORCED
                    example: ENFORCED
                  tags:
                    type: array
                    description: tags for this policy object
                    example:
                    - TAG1
                    - TAG2
                    items:
                      type: string
                  creatorId:
                    type: string
                    description: Policy's creator ID
                    example: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
                    readOnly: true
                  modifierId:
                    type: string
                    description: Policy's modifier ID
                    example: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
                    nullable: true
                    readOnly: true
                  violationOwnerAssignmentConfig:
                    nullable: true
                    type: object
                    title: Violation Owner Assignment Config
                    properties:
                      assignmentRule:
                        type: string
                        enum:
                        - MANAGER
                        - STATIC
                        - null
                        description: 'Details about the violations owner.

                          MANAGER - identity''s manager

                          STATIC - Governance Group or Identity'
                        example: MANAGER
                        nullable: true
                      ownerRef:
                        type: object
                        description: The owner of the violation assignment config.
                        nullable: true
                        properties:
                          type:
                            type: string
                            description: Owner type.
                            enum:
                            - IDENTITY
                            - GOVERNANCE_GROUP
                            - MANAGER
                            - null
                            example: IDENTITY
                          id:
                            type: string
                            description: Owner's ID.
                            example: 2c9180a46faadee4016fb4e018c20639
                          name:
                            type: string
                            description: Owner's name.
                            example: Support
                  scheduled:
                    type: boolean
                    description: defines whether a policy has been scheduled or not
                    example: true
                    default: false
                  type:
                    type: string
                    description: whether a policy is query based or conflicting access
                      based
                    default: GENERAL
                    enum:
                    - GENERAL
                    - CONFLICTING_ACCESS_BASED
                    example: GENERAL
                  conflictingAccessCriteria:
                    type: object
                    title: Conflicting Access Criteria
                    nullable: true
                    properties:
                      leftCriteria:
                        type: object
                        title: Access Criteria
                        properties:
                          name:
                            type: string
                            description: Business name for the access construct list
                            example: money-in
                          criteriaList:
                            type: array
                            description: List of criteria. There is a min of 1 and
                              max of 50 items in the list.
                            minItems: 1
                            maxItems: 50
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - ENTITLEMENT
                                  description: Type of the propery to which this reference
                                    applies to
                                  example: ENTITLEMENT
                                id:
                                  type: string
                                  description: ID of the object to which this reference
                                    applies to
                                  example: 2c91808568c529c60168cca6f90c1313
                                name:
                                  type: string
                                  description: Human-readable display name of the
                                    object to which this reference applies to
                                  example: Administrator
                            example:
                            - type: ENTITLEMENT
                              id: 2c9180866166b5b0016167c32ef31a66
                              name: Administrator
                            - type: ENTITLEMENT
                              id: 2c9180866166b5b0016167c32ef31a67
                              name: Administrator
                      rightCriteria:
                        type: object
                        title: Access Criteria
                        properties:
                          name:
                            type: string
                            description: Business name for the access construct list
                            example: money-in
                          criteriaList:
                            type: array
                            description: List of criteria. There is a min of 1 and
                              max of 50 items in the list.
                            minItems: 1
                            maxItems: 50
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - ENTITLEMENT
                                  description: Type of the propery to which this reference
                                    applies to
                                  example: ENTITLEMENT
                                id:
                                  type: string
                                  description: ID of the object to which this reference
                                    applies to
                                  example: 2c91808568c529c60168cca6f90c1313
                                name:
                                  type: string
                                  description: Human-readable display name of the
                                    object to which this reference applies to
                                  example: Administrator
                            example:
                            - type: ENTITLEMENT
                              id: 2c9180866166b5b0016167c32ef31a66
                              name: Administrator
                            - type: ENTITLEMENT
                              id: 2c9180866166b5b0016167c32ef31a67
                              name: Administrator
              examples:
                Conflicting Access Based Policy:
                  value:
                    id: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
                    name: Conflicting-Policy-Name
                    created: '2020-01-01T00:00:00.000000Z'
                    modified: '2020-01-01T00:00:00.000000Z'
                    description: Modified description
                    ownerRef:
                      type: IDENTITY
                      id: 2c91808568c529c60168cca6f90c1313
                      name: Owner Name
                    externalPolicyReference: XYZ policy
                    policyQuery: '@access(id:2c9180866166b5b0016167c32ef31a66 OR id:2c9180866166b5b0016167c32ef31a67)
                      AND @access(id:2c918087682f9a86016839c0509c1ab2)'
                    compensatingControls: Have a manager review the transaction decisions
                      for their "out of compliance" employee
                    correctionAdvice: Based on the role of the employee, managers
                      should remove access that is not required for their job function.
                    state: ENFORCED
                    tags:
                    - string
                    creatorId: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
                    modifierId: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
                    violationOwnerAssignmentConfig:
                      assignmentRule: MANAGER
                      ownerRef:
                        type: IDENTITY
                        id: 2c91808568c529c60168cca6f90c1313
                        name: Violation Owner Name
                    scheduled: true
                    type: CONFLICTING_ACCESS_BASED
                    conflictingAccessCriteria:
                      leftCriteria:
                        name: money-in-modified
                        criteriaList:
                        - type: ENTITLEMENT
                          id: 2c9180866166b5b0016167c32ef31a66
                        - type: ENTITLEMENT
                          id: 2c9180866166b5b0016167c32ef31a67
                      rightCriteria:
                        name: money-out-modified
                        criteriaList:
                        - type: ENTITLEMENT
                          id: 2c918087682f9a86016839c0509c1ab2
                General Policy:
                  value:
                    description: Modified description
                    ownerRef:
                      type: IDENTITY
                      id: 2c918087682f9a86016839c05e8f1aff
                      name: Owner Name
                    externalPolicyReference: New policy
                    policyQuery: policy query implementation
                    compensatingControls: Compensating controls
                    correctionAdvice: Correction advice
                    tags: []
