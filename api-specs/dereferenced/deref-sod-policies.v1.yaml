  /sod-policies/v1/{id}/violation-report/run:
    post:
      security:
      - userAuth:
        - idn:sod-violation:manage
      - applicationAuth:
        - idn:sod-violation:manage
      operationId: startSodPolicyV1
      tags:
      - SOD Policies
      summary: Runs sod policy violation report
      description: This invokes processing of violation report for given SOD policy.
        If the policy reports more than 5000 violations, the report returns with violation
        limit exceeded message.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        x-sailpoint-resource-operation-id: listSodPoliciesV1
