    get:
      security:
      - userAuth:
        - idn:sod-policy:read
        - idn:sod-policy:manage
      operationId: listSodPoliciesV1
      tags:
      - SOD Policies
      summary: List sod policies
      description: 'This gets list of all SOD policies.

        Requires role of ORG_ADMIN'
      parameters:
      - in: query
        name: limit
        description: 'Max number of results to return.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: 250
        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 250
          default: 250
      - in: query
        name: offset
        description: 'Offset into the full result set. Usually specified with *limit*
          to paginate through the results.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: 0
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - in: query
        name: count
        description: 'If *true* it will populate the *X-Total-Count* response header
          with the number of results that would be returned if *limit* and *offset*
          were ignored.


          Since requesting a total count can have a performance impact, it is recommended
          not to send **count=true** if that value will not be used.


          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: true
        schema:
          type: boolean
          default: false
      - in: query
        name: filters
        schema:
          type: string
        description: 'Filter results using the standard syntax described in [V3 API
          Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


          Filtering is supported for the following fields and operators:


          **id**: *eq, in*


          **name**: *eq, in*


          **state**: *eq, in*'
        example: id eq "bc693f07e7b645539626c25954c58554"
        required: false
      - in: query
        name: sorters
        required: false
        schema:
          type: string
          format: comma-separated
        example: id,name
        description: 'Sort results using the standard syntax described in [V3 API
          Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


          Sorting is supported for the following fields: **id, name, created, modified,
          description**'
      responses:
        '200':
          description: List of all SOD policies.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: Sod Policy
                  properties:
                    id:
                      type: string
                      description: Policy id
                      example: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
                      readOnly: true
                    name:
                      type: string
                      description: Policy Business Name
                      example: policy-xyz
                    created:
                      type: string
                      format: date-time
                      description: The time when this SOD policy is created.
                      example: '2020-01-01T00:00:00.000000Z'
                      readOnly: true
                    modified:
                      type: string
                      format: date-time
                      description: The time when this SOD policy is modified.
                      example: '2020-01-01T00:00:00.000000Z'
                      readOnly: true
                    description:
                      type: string
                      description: Optional description of the SOD policy
                      example: This policy ensures compliance of xyz
                      nullable: true
                    ownerRef:
                      type: object
                      description: The owner of the SOD policy.
                      properties:
                        type:
                          type: string
                          description: Owner type.
                          enum:
                          - IDENTITY
                          - GOVERNANCE_GROUP
                          example: IDENTITY
                        id:
                          type: string
                          description: Owner's ID.
                          example: 2c9180a46faadee4016fb4e018c20639
                        name:
                          type: string
                          description: Owner's name.
                          example: Support
                    externalPolicyReference:
                      type: string
                      description: Optional External Policy Reference
                      example: XYZ policy
                      nullable: true
                    policyQuery:
                      type: string
                      description: Search query of the SOD policy
                      example: '@access(id:0f11f2a4-7c94-4bf3-a2bd-742580fe3bdg) AND
                        @access(id:0f11f2a4-7c94-4bf3-a2bd-742580fe3bdf)'
                    compensatingControls:
                      type: string
                      description: Optional compensating controls(Mitigating Controls)
                      example: Have a manager review the transaction decisions for
                        their "out of compliance" employee
                      nullable: true
                    correctionAdvice:
                      type: string
                      description: Optional correction advice
                      example: Based on the role of the employee, managers should
                        remove access that is not required for their job function.
                      nullable: true
                    state:
                      type: string
                      description: whether the policy is enforced or not
                      enum:
                      - ENFORCED
                      - NOT_ENFORCED
                      example: ENFORCED
                    tags:
                      type: array
                      description: tags for this policy object
                      example:
                      - TAG1
                      - TAG2
                      items:
                        type: string
                    creatorId:
                      type: string
                      description: Policy's creator ID
                      example: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
                      readOnly: true
                    modifierId:
                      type: string
                      description: Policy's modifier ID
                      example: 0f11f2a4-7c94-4bf3-a2bd-742580fe3bde
                      nullable: true
                      readOnly: true
