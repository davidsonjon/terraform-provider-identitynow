  /sod-policies/v1/{id}/schedule:
    get:
      security:
      - userAuth:
        - idn:sod-policy:read
        - idn:sod-policy:manage
      operationId: getSodPolicyScheduleV1
      tags:
      - SOD Policies
      summary: Get sod policy schedule
      description: This endpoint gets a specified SOD policy's schedule.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        x-sailpoint-resource-operation-id: listSodPoliciesV1
        description: The ID of the SOD policy schedule to retrieve.
        example: ef38f943-47e9-4562-b5bb-8424a56397d8
      responses:
        '200':
          description: SOD policy schedule.
          content:
            application/json:
              schema:
                type: object
                title: Sod Policy Schedule
                properties:
                  name:
                    type: string
                    description: SOD Policy schedule name
                    example: SCH-1584312283015
                  created:
                    type: string
                    format: date-time
                    description: The time when this SOD policy schedule is created.
                    example: '2020-01-01T00:00:00.000000Z'
                    readOnly: true
                  modified:
                    type: string
                    format: date-time
                    description: The time when this SOD policy schedule is modified.
                    example: '2020-01-01T00:00:00.000000Z'
                    readOnly: true
                  description:
                    type: string
                    description: SOD Policy schedule description
                    example: Schedule for policy xyz
                  schedule:
                    type: object
                    description: The schedule information.
                    properties:
                      type:
                        description: 'Enum representing the currently supported schedule
                          types.


                          Additional values may be added in the future without notice.

                          '
                        type: string
                        enum:
                        - DAILY
                        - WEEKLY
                        - MONTHLY
                        - CALENDAR
                        - ANNUALLY
                        example: WEEKLY
                      months:
                        type: object
                        description: 'The months to execute the search. This only
                          applies to schedules with a type of `ANNUALLY`.

                          '
                        example:
                          type: LIST
                          values:
                          - '3'
                          - '6'
                          - '9'
                          - '12'
                        nullable: true
                        properties:
                          type:
                            description: 'Enum representing the currently supported
                              selector types.


                              LIST - the *values* array contains one or more distinct
                              values.


                              RANGE - the *values* array contains two values: the
                              start and end of the range, inclusive.


                              Additional values may be added in the future without
                              notice.

                              '
                            type: string
                            enum:
                            - LIST
                            - RANGE
                            example: LIST
                          values:
                            description: 'The selected values.

                              '
                            type: array
                            items:
                              type: string
                            example:
                            - MON
                            - WED
                          interval:
                            nullable: true
                            description: 'The selected interval for RANGE selectors.

                              '
                            type: integer
                            format: int32
                            example: 3
                        required:
                        - type
                        - values
                      days:
                        type: object
                        description: 'The days to execute the search.


                          If `type` is `WEEKLY`, the values will be `MON`, `TUE`,
                          `WED`, `THU`, `FRI`, `SAT`, and `SUN`.


                          If `type` is `MONTHLY` or `ANNUALLY`, the values will be
                          a number in double quotes, like `"1"`, `"10"`, or `"28"`.  Optionally,
                          the value `"L"` can be used to refer to the last day of
                          the month.

                          '
                        example:
                          type: LIST
                          values:
                          - MON
                          - WED
                          - FRI
                        nullable: true
                        properties:
                          type:
                            description: 'Enum representing the currently supported
