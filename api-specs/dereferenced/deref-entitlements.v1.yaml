  /entitlements/v1/{id}/entitlement-request-config:
    get:
      operationId: getEntitlementRequestConfigV1
      tags:
      - Entitlements
      summary: Get entitlement request config
      description: This API returns the entitlement request config for a specified
        entitlement.
      security:
      - userAuth:
        - idn:entitlement:read
        - idn:entitlement:manage
      - applicationAuth:
        - idn:entitlement:read
        - idn:entitlement:manage
      x-sailpoint-userLevels:
      - ORG_ADMIN
      - SOURCE_SUBADMIN
      - SOURCE_ADMIN
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        x-sailpoint-resource-operation-id: listEntitlementsV1
        description: Entitlement Id
        example: 2c91808874ff91550175097daaec161c
      responses:
        '200':
          description: An Entitlement Request Config
          content:
            application/json:
              schema:
                type: object
                title: Entitlement Request Config
                properties:
                  accessRequestConfig:
                    type: object
                    title: Entitlement Access Request Config
                    properties:
                      approvalSchemes:
                        type: array
                        description: Ordered list of approval steps for the access
                          request. Empty when no approval is required.
                        items:
                          type: object
                          title: Entitlement Approval Scheme
                          properties:
                            approverType:
                              type: string
                              enum:
                              - ENTITLEMENT_OWNER
                              - SOURCE_OWNER
                              - MANAGER
                              - GOVERNANCE_GROUP
                              - WORKFLOW
                              description: 'Describes the individual or group that
                                is responsible for an approval step. Values are as
                                follows.


                                **ENTITLEMENT_OWNER**: Owner of the associated Entitlement


                                **SOURCE_OWNER**: Owner of the associated Source


                                **MANAGER**: Manager of the Identity for whom the
                                request is being made


                                **GOVERNANCE_GROUP**: A Governance Group, the ID of
                                which is specified by the **approverId** field


                                **WORKFLOW**: A Workflow, the ID of which is specified
                                by the **approverId** field, Workflows are exclusive
                                to other types of approvals and License required.     '
                              example: GOVERNANCE_GROUP
                            approverId:
                              type: string
                              nullable: true
                              description: Id of the specific approver, used only
                                when approverType is GOVERNANCE_GROUP or WORKFLOW
                              example: e3eab852-8315-467f-9de7-70eda97f63c8
                      requestCommentRequired:
                        type: boolean
                        description: If the requester must provide a comment during
                          access request.
                        default: false
                        example: true
                      denialCommentRequired:
                        type: boolean
                        description: If the reviewer must provide a comment when denying
                          the access request.
                        default: false
                        example: false
