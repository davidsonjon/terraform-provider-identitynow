  /entitlements/v1/{id}/access-model-metadata/{attributeKey}/values/{attributeValue}:
    post:
      summary: Add metadata to an entitlement.
      description: Add single Access Model Metadata to an entitlement.
      tags:
      - Entitlements
      operationId: createAccessModelMetadataForEntitlementV1
      security:
      - userAuth:
        - idn:entitlement:manage
      x-sailpoint-userLevels:
      - ORG_ADMIN
      parameters:
      - name: id
        in: path
        required: true
        x-sailpoint-resource-operation-id: listEntitlementsV1
        schema:
          type: string
        description: The entitlement id.
        example: 2c91808c74ff913f0175097daa9d59cd
      - name: attributeKey
        in: path
        required: true
        x-sailpoint-resource-operation-id: listAccessModelMetadataAttributeV1
        schema:
          type: string
        description: Technical name of the Attribute.
        example: iscPrivacy
      - name: attributeValue
        in: path
        required: true
        x-sailpoint-resource-operation-id: listAccessModelMetadataAttributeValueV1
        schema:
          type: string
        description: Technical name of the Attribute Value.
        example: public
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                title: Entitlement
                properties:
                  id:
                    type: string
                    description: The entitlement id
                    example: 2c91808874ff91550175097daaec161c
                  name:
                    type: string
                    description: The entitlement name
                    example: PayrollControls
                  attribute:
                    type: string
                    description: The entitlement attribute name
                    example: memberOf
                  value:
                    type: string
                    description: The value of the entitlement
                    example: CN=PayrollControls,OU=Groups,OU=Demo,DC=seri,DC=sailpointdemo,DC=com
                  sourceSchemaObjectType:
                    type: string
                    description: The object type of the entitlement from the source
                      schema
                    example: group
                  description:
                    type: string
                    description: The description of the entitlement
                    example: Grants the ability to access and manage payroll-related
                      controls and settings within the Corporate Active Directory
                      system.
                    nullable: true
                  privileged:
                    type: boolean
                    description: True if the entitlement is privileged
                    default: false
                    example: true
                  cloudGoverned:
                    type: boolean
                    description: True if the entitlement is cloud governed
                    default: false
                    example: true
                  requestable:
                    type: boolean
                    description: True if the entitlement is able to be directly requested
                    example: true
                    default: false
                  owner:
                    type: object
                    description: The identity that owns the entitlement
                    nullable: true
                    properties:
                      id:
                        type: string
                        description: The identity ID
                        example: 2c9180827ca885d7017ca8ce28a000eb
                      type:
                        type: string
                        enum:
                        - IDENTITY
                        description: The type of object
                        example: IDENTITY
                      name:
                        type: string
                        description: The display name of the identity
                        example: john.doe
                  additionalOwners:
                    type: array
                    nullable: true
                    description: List of additional owner references beyond the primary
                      owner. Each entry may be an identity (IDENTITY) or a governance
                      group (GOVERNANCE_GROUP).
                    items:
                      type: object
                      description: Reference to an additional owner (identity or governance
                        group).
                      properties:
                        type:
                          type: string
                          enum:
                          - IDENTITY
                          - GOVERNANCE_GROUP
                          description: Type of the additional owner; IDENTITY for
                            an identity, GOVERNANCE_GROUP for a governance group.
                          example: IDENTITY
                        id:
                          type: string
                          description: ID of the identity or governance group.
                          example: 2c9180a46faadee4016fb4e018c20639
                        name:
                          type: string
                          nullable: true
                          description: Display name. It may be left null or omitted
                            on input. If set, it must match the current display name
                            of the identity or governance group, otherwise a 400 Bad
                            Request error may result.
                          example: support
                  manuallyUpdatedFields:
                    type: object
                    description: A map of entitlement fields that have been manually
                      updated. The key is the field name in UPPER_SNAKE_CASE format,
                      and the value is true or false to indicate if the field has
                      been updated.
                    nullable: true
                    additionalProperties: true
                    example:
                      DISPLAY_NAME: true
                      DESCRIPTION: true
                  accessModelMetadata:
                    type: object
                    description: Additional data to classify the entitlement
                    properties:
                      attributes:
                        type: array
                        items:
                          type: object
                          title: Access Model Metadata
                          description: Metadata that describes an access item
                          properties:
                            key:
                              type: string
                              description: Unique identifier for the metadata type
                              example: iscCsp
                            name:
                              type: string
                              description: Human readable name of the metadata type
                              example: CSP
                            multiselect:
                              type: boolean
                              default: false
                              example: true
                              description: Allows selecting multiple values
                            status:
                              type: string
                              description: The state of the metadata item
                              example: active
                            type:
                              type: string
                              description: The type of the metadata item
                              example: governance
                            objectTypes:
                              type: array
                              description: The types of objects
                              example:
                              - general
                              items:
                                type: string
                                example: general
                            description:
                              type: string
                              description: Describes the metadata item
                              example: Indicates the type of deployment environment
                                of an access item.
                            values:
                              type: array
                              description: The value to assign to the metadata item
                              items:
                                type: object
                                description: An individual value to assign to the
                                  metadata item
                                properties:
                                  value:
                                    type: string
                                    description: The value to assign to the metdata
                                      item
                                    example: development
                                  name:
                                    type: string
                                    description: Display name of the value
                                    example: Development
                                  status:
                                    type: string
                                    description: The status of the individual value
                                    example: active
                  created:
                    type: string
                    description: Time when the entitlement was created
                    format: date-time
                    example: '2020-10-08T18:33:52.029Z'
                  modified:
                    type: string
                    description: Time when the entitlement was last modified
                    format: date-time
                    example: '2020-10-08T18:33:52.029Z'
                  source:
                    type: object
                    properties:
                      id:
