  /entitlements/v1/bulk-update:
    post:
      operationId: updateEntitlementsInBulkV1
      tags:
      - Entitlements
      summary: Bulk update an entitlement list
      security:
      - userAuth:
        - idn:entitlement:update
        - idn:source-checked:update
      x-sailpoint-userLevels:
      - ORG_ADMIN
      - SOURCE_ADMIN
      description: 'This API applies an update to every entitlement of the list.



        The number of entitlements to update is limited to 50 items maximum.



        The JsonPatch update follows the [JSON Patch](https://tools.ietf.org/html/rfc6902)
        standard.

        examples of allowed operations :

        `**{ "op": "replace", "path": "/requestable","value": boolean }**`

        `**{ "op": "replace", "path": "/privilegeOverride/level","value": string }**`


        A token with ORG_ADMIN or API authority is required to call this API.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: Entitlement Bulk Update Request
              description: Object for specifying the bulk update request
              properties:
                entitlementIds:
                  type: array
                  description: List of entitlement ids to update
                  maxItems: 50
                  items:
                    type: string
                  example:
                  - 2c91808a7624751a01762f19d665220d
                  - 2c91808a7624751a01762f19d67c220e
                  - 2c91808a7624751a01762f19d692220f
                jsonPatch:
                  type: array
                  items:
                    type: object
                    title: Json Patch Operation
                    description: A JSONPatch Operation as defined by [RFC 6902 - JSON
                      Patch](https://tools.ietf.org/html/rfc6902)
                    required:
                    - op
                    - path
                    properties:
                      op:
                        type: string
                        description: The operation to be performed
                        enum:
                        - add
                        - remove
                        - replace
                        - move
                        - copy
                        - test
                        example: replace
                      path:
                        type: string
                        description: A string JSON Pointer representing the target
                          path to an element to be affected by the operation
                        example: /description
                      value:
                        oneOf:
                        - type: string
                          example: New description
                          title: string
                        - type: boolean
                          example: true
                          title: boolean
                        - type: integer
                          example: 300
                          title: integer
                        - type: object
                          title: object
                          example:
                            attributes:
                              name: philip
                        - type: array
                          title: array
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                            - type: object
                            example:
                            - '001'
                            - '002'
                            - '003'
                        description: The value to be used for the operation, required
                          for "add" and "replace" operations
                        example: New description
                  example:
                  - op: replace
                    path: /requestable
                    value: false
                  - op: replace
                    path: /privilegeOverride/level
                    value: HIGH
              required:
              - entitlementIds
              - jsonPatch
