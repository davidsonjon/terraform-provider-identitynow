    post:
      tags:
      - Entitlements
      summary: Aggregate entitlements
      deprecated: true
      operationId: importEntitlementsBySourceV1
      description: 'Starts an entitlement aggregation on the specified source. Though
        this endpoint has been deprecated, you can find its Beta equivalent [here](https://developer.sailpoint.com/docs/api/import-entitlements-v-1).


