    patch:
      operationId: patchEntitlementV1
      tags:
      - Entitlements
      summary: Patch an entitlement
      description: 'This API updates an existing entitlement using [JSON Patch](https://tools.ietf.org/html/rfc6902)
        syntax.


        The following fields are patchable: **requestable**, **segments**, **privilegeOverride/level**,
        **owner**, **name**, **description**, and **manuallyUpdatedFields**


        When you''re patching owner, only owner type and owner id must be provided.
        Owner name is optional, and it won''t be modified. If the owner name is provided,
        it should correspond to the real name. The only owner type currently supported
        is IDENTITY.'
      security:
      - userAuth:
        - idn:entitlement:manage
        - idn:entitlement:update
      x-sailpoint-userLevels:
      - ORG_ADMIN
      - SOURCE_ADMIN
      parameters:
      - name: id
        in: path
        description: ID of the entitlement to patch
        required: true
        x-sailpoint-resource-operation-id: listEntitlementsV1
        schema:
          type: string
          example: 2c91808a7813090a017814121e121518
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                type: object
                title: Json Patch Operation
                description: A JSONPatch Operation as defined by [RFC 6902 - JSON
                  Patch](https://tools.ietf.org/html/rfc6902)
                required:
                - op
                - path
                properties:
                  op:
                    type: string
                    description: The operation to be performed
                    enum:
                    - add
                    - remove
                    - replace
                    - move
                    - copy
                    - test
                    example: replace
                  path:
                    type: string
                    description: A string JSON Pointer representing the target path
                      to an element to be affected by the operation
                    example: /description
                  value:
                    oneOf:
                    - type: string
                      example: New description
                      title: string
                    - type: boolean
                      example: true
                      title: boolean
                    - type: integer
                      example: 300
                      title: integer
                    - type: object
                      title: object
                      example:
                        attributes:
                          name: philip
                    - type: array
                      title: array
                      items:
                        anyOf:
                        - type: string
                        - type: integer
                        - type: object
                        example:
                        - '001'
                        - '002'
                        - '003'
                    description: The value to be used for the operation, required
                      for "add" and "replace" operations
                    example: New description
              example:
              - op: replace
                path: /requestable
                value: true
            examples:
              Assign an entitlement to a segment:
                description: This example shows how to use patch to assign an entitlement
                  to a segment by adding the segment's ID to the entitlement's segments
                  array.
                value:
                - op: add
                  path: /segments/-
                  value: f7b1b8a3-5fed-4fd4-ad29-82014e137e19
              Assign an owner to an entitlement:
                description: This example shows how to use patch to assign an owner
                  to an entitlement by adding the owner's info to the entitlement.
                value:
                - op: add
                  path: /owner
                  value:
                    type: IDENTITY
                    id: 2c9180858315595501831958427e5424
              Replace an owner for an entitlement:
                description: This example shows how to use patch to replace an entitlement's
                  owner by replacing the owner's info to the entitlement.
                value:
                - op: replace
                  path: /owner
                  value:
                    type: IDENTITY
                    id: 2c9180858315595501831958427e5424
              Set entitlement manually updated fields:
                description: 'This example shows how to set an entitlement''s manually
                  updated fields values with patch request. Values for all manually
                  updateable fields must be specified in the request. For now only
                  two entitlement fields support this: DISPLAY_NAME and DESCRIPTION.'
                value:
                - op: replace
                  path: /manuallyUpdatedFields
                  value:
                    DISPLAY_NAME: true
                    DESCRIPTION: true
              Add the description for an entitlement:
                description: This example shows how to use patch to add a description
                  for the entitlement.
                value:
                - op: add
                  path: /description
                  value: new description for the entitlement
              Update the name for an entitlement:
                description: This example shows how to use patch to update an entitlement's
                  name.
                value:
                - op: replace
                  path: /name
                  value: entitlement new name
              Override privilege level for an entitlement:
                description: This example shows how to use patch to update an entitlement's
                  privilege level.
                value:
                - op: replace
                  path: /privilegeOverride/level
                  value: MEDIUM
      responses:
        '200':
          description: Responds with the entitlement as updated.
          content:
            application/json:
              schema:
                type: object
                title: Entitlement
                properties:
                  id:
                    type: string
                    description: The entitlement id
                    example: 2c91808874ff91550175097daaec161c
                  name:
                    type: string
                    description: The entitlement name
                    example: Account Payable
                  attribute:
                    type: string
                    description: The entitlement attribute name
                    example: memberOf
                  value:
                    type: string
                    description: The value of the entitlement
                    example: CN=Account Payable,OU=Finance,DC=xyz company
                  sourceSchemaObjectType:
                    type: string
                    description: The object type of the entitlement from the source
                      schema
                    example: group
                  description:
                    type: string
                    description: The description of the entitlement
                    example: This entitlement allows users to access the accounts
                      payable module of the organization's financial management system.
                      Users can view, process, and approve invoices, manage vendor
                      relationships, and perform other accounts payable-related tasks.
                    nullable: true
                  privilegeLevel:
                    type: object
                    title: Requested Account Ref
                    description: Privilege level of the entitlement
                    nullable: true
                    properties:
                      direct:
                        type: string
                        description: Direct privilege level assigned to the entitlement
                        example: HIGH
                        enum:
                        - HIGH
                        - LOW
                        - MEDIUM
                        - NONE
                      setBy:
                        type: string
                        description: User or process that set the privilege level
                        example: SAILPOINT_MIGRATION
                      setByType:
                        type: string
                        nullable: true
                        description: Method by which the privilege level was set
                        example: OVERRIDE
                        enum:
                        - OVERRIDE
                        - CUSTOM_CRITERIA
                        - CONNECTOR_CRITERIA
                        - SINGLE_LEVEL_CRITERIA
                      inherited:
                        type: string
                        nullable: true
                        description: Inherited privilege level on the entitlement,
                          if any
                        example: null
                        enum:
                        - HIGH
                        - LOW
                        - MEDIUM
                        - NONE
                      effective:
                        type: string
                        description: Effective privilege level assigned to the entitlement
                        example: HIGH
                        enum:
                        - HIGH
                        - LOW
                        - MEDIUM
                        - NONE
                  tags:
                    type: array
                    description: List of tags assigned to the entitlement
                    items:
                      type: string
                    example:
                    - tag1
                    - tag2
                    nullable: true
                  cloudGoverned:
                    type: boolean
                    description: True if the entitlement is cloud governed
                    default: false
                    example: true
                  requestable:
                    type: boolean
                    description: True if the entitlement is able to be directly requested
                    example: true
                    default: false
                  owner:
                    type: object
                    description: The identity that owns the entitlement
                    nullable: true
                    properties:
                      id:
                        type: string
                        description: The identity ID
                        example: 2c9180827ca885d7017ca8ce28a000eb
                      type:
                        type: string
                        enum:
                        - IDENTITY
                        description: The type of object
                        example: IDENTITY
                      name:
                        type: string
                        description: The display name of the identity
                        example: john.doe
                  manuallyUpdatedFields:
                    type: object
                    description: A map of entitlement fields that have been manually
                      updated. The key is the field name in UPPER_SNAKE_CASE format,
                      and the value is true or false to indicate if the field has
                      been updated.
                    nullable: true
                    additionalProperties: true
                    example:
                      DISPLAY_NAME: true
                      DESCRIPTION: true
                  accessModelMetadata:
                    type: object
                    description: Additional data to classify the entitlement
                    properties:
                      attributes:
                        type: array
                        items:
                          type: object
                          title: Access Model Metadata
                          description: Metadata that describes an access item
                          properties:
                            key:
                              type: string
                              description: Unique identifier for the metadata type
                              example: iscCsp
                            name:
                              type: string
                              description: Human readable name of the metadata type
                              example: CSP
                            multiselect:
                              type: boolean
                              default: false
                              example: true
                              description: Allows selecting multiple values
                            status:
                              type: string
                              description: The state of the metadata item
                              example: active
                            type:
                              type: string
                              description: The type of the metadata item
                              example: governance
                            objectTypes:
                              type: array
                              description: The types of objects
                              example:
                              - general
                              items:
                                type: string
                                example: general
                            description:
                              type: string
                              description: Describes the metadata item
                              example: Indicates the type of deployment environment
                                of an access item.
                            values:
                              type: array
                              description: The value to assign to the metadata item
                              items:
                                type: object
                                description: An individual value to assign to the
                                  metadata item
                                properties:
                                  value:
                                    type: string
                                    description: The value to assign to the metdata
                                      item
                                    example: development
                                  name:
                                    type: string
                                    description: Display name of the value
                                    example: Development
                                  status:
                                    type: string
                                    description: The status of the individual value
                                    example: active
                  created:
                    type: string
                    description: Time when the entitlement was created
                    format: date-time
                    example: '2020-10-08T18:33:52.029Z'
                  modified:
                    type: string
                    description: Time when the entitlement was last modified
                    format: date-time
                    example: '2020-10-08T18:33:52.029Z'
                  source:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The source ID
                        example: 2c9180827ca885d7017ca8ce28a000eb
                      type:
                        type: string
                        description: The source type, will always be "SOURCE"
                        example: SOURCE
                      name:
                        type: string
                        description: The source name
                        example: ODS-AD-Source
                  attributes:
                    type: object
                    description: A map of free-form key-value pairs from the source
                      system
                    example:
                      fieldName: fieldValue
                    additionalProperties: true
                  segments:
                    type: array
                    items:
                      type: string
                    nullable: true
                    description: List of IDs of segments, if any, to which this Entitlement
                      is assigned.
                    example:
                    - f7b1b8a3-5fed-4fd4-ad29-82014e137e19
                    - 29cb6c06-1da8-43ea-8be4-b3125f248f2a
                  directPermissions:
                    type: array
                    items:
                      type: object
                      title: Permission DTO
                      description: Simplified DTO for the Permission objects stored
                        in SailPoint's database. The data is aggregated from customer
                        systems and is free-form, so its appearance can vary largely
                        between different clients/customers.
                      properties:
                        rights:
                          type: array
                          description: All the rights (e.g. actions) that this permission
                            allows on the target
                          example: HereIsRight1
                          readOnly: true
                          items:
                            type: string
                            example: SELECT
                        target:
                          type: string
                          description: The target the permission would grants rights
                            on.
                          readOnly: true
                          example: SYS.GV_$TRANSACTION
