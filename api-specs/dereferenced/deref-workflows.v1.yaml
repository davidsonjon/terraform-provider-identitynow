    put:
      operationId: putWorkflowV1
      tags:
      - Workflows
      summary: Update workflow
      description: Perform a full update of a workflow.  The updated workflow object
        is returned in the response.
      security:
      - userAuth:
        - sp:workflow:manage
      parameters:
      - name: id
        in: path
        description: Id of the Workflow
        required: true
        x-sailpoint-resource-operation-id: listWorkflowsV1
        style: simple
        explode: false
        schema:
          type: string
          example: c17bea3a-574d-453c-9e04-4365fbf5af0b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the workflow
                  example: Send Email
                owner:
                  type: object
                  description: The identity that owns the workflow.  The owner's permissions
                    in IDN will determine what actions the workflow is allowed to
                    perform.  Ownership can be changed by updating the owner in a
                    PUT or PATCH request.
                  properties:
                    type:
                      type: string
                      enum:
                      - IDENTITY
                      example: IDENTITY
                      description: The type of object that is referenced
                    id:
                      type: string
                      description: The unique ID of the object
                      example: 2c91808568c529c60168cca6f90c1313
                    name:
                      type: string
                      description: The name of the object
                      example: William Wilson
                description:
                  type: string
                  description: Description of what the workflow accomplishes
                  example: Send an email to the identity who's attributes changed.
                definition:
                  type: object
                  description: The map of steps that the workflow will execute.
                  properties:
                    start:
                      type: string
                      description: The name of the starting step.
                      example: Send Email Test
                    steps:
                      type: object
                      description: One or more step objects that comprise this workflow.  Please
                        see the Workflow documentation to see the JSON schema for
                        each step type.
                      additionalProperties: true
                      example:
                        Send Email:
                          actionId: sp:send-email
                          attributes:
                            body: This is a test
                            from: sailpoint@sailpoint.com
                            recipientId.$: $.identity.id
                            subject: test
                          nextStep: success
                          selectResult: null
                          type: ACTION
                        success:
                          type: success
                enabled:
                  type: boolean
                  description: Enable or disable the workflow.  Workflows cannot be
                    created in an enabled state.
                  default: false
                  example: false
                trigger:
                  type: object
                  description: The trigger that starts the workflow
                  required:
                  - type
                  - attributes
                  properties:
                    type:
                      type: string
                      enum:
                      - EVENT
                      - EXTERNAL
                      - SCHEDULED
                      - ''
                      example: EVENT
                      description: The trigger type
                    displayName:
                      type: string
                      nullable: true
                      description: The trigger display name
                    attributes:
                      nullable: true
                      anyOf:
                      - title: Event Trigger Attributes
                        type: object
                        description: Attributes related to an IdentityNow ETS event
                        additionalProperties: false
                        required:
                        - id
                        properties:
                          id:
                            type: string
                            description: The unique ID of the trigger
                            example: idn:identity-attributes-changed
                            nullable: true
                          filter.$:
                            type: string
                            description: JSON path expression that will limit which
                              events the trigger will fire on
                            example: $.changes[?(@.attribute == 'manager')]
                            nullable: true
                          description:
                            type: string
                            description: Description of the event trigger
                            example: Triggered when an identity's manager attribute
                              changes
                            nullable: true
                          attributeToFilter:
                            type: string
                            description: The attribute to filter on
                            example: LifecycleState
                            nullable: true
                          formDefinitionId:
                            type: string
                            description: Form definition's unique identifier.
                            example: Admin_Access_Request_Form
                            nullable: true
                      - title: External Trigger Attributes
                        type: object
                        description: Attributes related to an external trigger
                        additionalProperties: false
                        properties:
                          name:
                            type: string
                            description: A unique name for the external trigger
                            example: search-and-notify
                            nullable: true
                          description:
                            type: string
                            description: Additional context about the external trigger
                            example: Run a search and notify the results
                            nullable: true
                          clientId:
                            type: string
                            description: OAuth Client ID to authenticate with this
                              trigger
                            example: 87e239b2-b85b-4bde-b9a7-55bf304ddcdc
                            nullable: true
                          url:
                            type: string
                            description: URL to invoke this workflow
                            example: https://example-tenant.api.identitynow.com/workflows/v1/execute/external/c79e0079-562c-4df5-aa73-60a9e25c916d
                            nullable: true
                      - title: Scheduled Trigger Attributes
                        type: object
                        description: Attributes related to a scheduled trigger
                        additionalProperties: false
                        required:
                        - frequency
                        properties:
                          frequency:
                            type: string
                            description: Frequency of execution
                            example: daily
                            enum:
                            - daily
                            - weekly
                            - monthly
                            - yearly
                            - cronSchedule
                            - null
                            nullable: true
                          timeZone:
                            type: string
                            description: Time zone identifier
                            example: America/Chicago
                            nullable: true
                          cronString:
                            type: string
                            description: A valid CRON expression
                            externalDocs:
                              description: CRON expression editor
                              url: https://crontab.guru/
                            example: 0 9 * * 1
                            nullable: true
                          weeklyDays:
                            type: array
                            items:
                              type: string
                            example: Monday
                            description: Scheduled days of the week for execution
                            nullable: true
                          weeklyTimes:
                            type: array
                            items:
                              type: string
                            example: Monday
                            description: Scheduled execution times
                            nullable: true
                          yearlyTimes:
                            type: array
                            items:
                              type: string
                            example: '1969-12-31T09:00:00.000Z'
                            description: Scheduled execution times
                            nullable: true
                      description: Workflow Trigger Attributes.
