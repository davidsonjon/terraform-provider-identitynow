  /workflows/v1/{id}/test:
    post:
      operationId: testWorkflowV1
      tags:
      - Workflows
      summary: Test workflow by id
      description: ':::info


        Workflow must be disabled in order to use this endpoint.


        :::


        Test a workflow with the provided input data.  The input data should resemble
        the input that the trigger will send the workflow.  See the [event trigger
        documentation](https://developer.sailpoint.com/docs/extensibility/event-triggers/available)
        for an example input for the trigger that initiates this workflow.


        This endpoint will return an execution ID, which can be used to lookup more
        information about the execution using the `Get a Workflow Execution` endpoint.


        **This will cause a live run of the workflow, which could result in unintended
        modifications to your IDN tenant.**

        '
      security:
      - userAuth:
        - sp:workflow-execute:external
      x-sailpoint-userLevels:
      - ORG_ADMIN
      parameters:
      - name: id
        in: path
        description: Id of the workflow
        required: true
        x-sailpoint-resource-operation-id: listWorkflowsV1
        style: simple
        explode: false
        schema:
          type: string
          example: c17bea3a-574d-453c-9e04-4365fbf5af0b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              properties:
                input:
                  type: object
                  description: The test input for the workflow.
