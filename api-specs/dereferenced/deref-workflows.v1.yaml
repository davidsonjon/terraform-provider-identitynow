        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 250
          default: 250
      - in: query
        name: offset
        description: 'Offset into the full result set. Usually specified with *limit*
          to paginate through the results.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: 0
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - in: query
        name: filters
        required: false
        schema:
          type: string
        description: 'Filter results using the standard syntax described in [V3 API
          Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


          Filtering is supported for the following fields and operators:


          **id**: *eq*'
        example: id eq "sp:create-campaign"
      security:
      - userAuth:
        - sp:workflow:read
        - sp:workflow:manage
      responses:
        '200':
          description: List of workflow actions
          content:
            application/json:
              schema:
                type: array
                items:
                  title: Workflow Action
                  type: object
                  properties:
                    id:
                      type: string
                      description: Action ID. This is a static namespaced ID for the
                        action
                      example: sp:create-campaign
                    name:
                      type: string
                      description: Action Name
                      example: Create Certification Campaign
                    type:
                      type: string
                      description: Action type
                      example: ACTION
                    description:
                      type: string
                      description: Action Description
                      example: Generates a certification campaign.
                    formFields:
                      nullable: true
                      type: array
                      description: One or more inputs that the action accepts
                      items:
                        type: object
                        properties:
                          description:
                            type: string
                            description: Description of the form field
                            example: First value to compare
                          helpText:
                            type: string
                            description: Describes the form field in the UI
                            example: The name to give to this certification campaign.
                          label:
                            type: string
                            description: A human readable name for this form field
                              in the UI
                            example: Campaign Name
                          name:
                            type: string
                            description: The name of the input attribute
                            example: name
                          required:
                            type: boolean
                            description: Denotes if this field is a required attribute
                            example: false
                            default: false
                          type:
                            description: The type of the form field
                            type: string
                            nullable: true
                            enum:
                            - text
                            - textarea
                            - boolean
                            - email
                            - url
                            - number
                            - json
                            - checkbox
                            - jsonpath
                            - select
                            - multiType
                            - duration
                            - toggle
                            - formPicker
                            - identityPicker
                            - governanceGroupPicker
                            - string
                            - object
                            - array
                            - secret
                            - keyValuePairs
                            - emailPicker
                            - advancedToggle
                            - variableCreator
                            - htmlEditor
                            example: text
                    exampleOutput:
                      oneOf:
                      - type: object
                        description: Example output
                      - type: array
                        items:
                          type: object
                    deprecated:
                      type: boolean
                    deprecatedBy:
                      type: string
                      format: date-time
                    versionNumber:
                      type: integer
                      description: Version number
                    isSimulationEnabled:
                      type: boolean
                    isDynamicSchema:
                      type: boolean
                      description: Determines whether the dynamic output schema is
                        returned in place of the action's output schema. The dynamic
                        schema lists non-static properties, like properties of a workflow
                        form where each form has different fields. These will be provided
                        dynamically based on available form fields.
                      example: false
                      default: false
                    outputSchema:
                      type: object
                      description: Defines the output schema, if any, that this action
                        produces.
                      example:
                        definitions: {}
                        properties:
                          autoRevokeAllowed:
                            $id: '#sp:create-campaign/autoRevokeAllowed'
                            default: true
                            examples:
                            - false
                            title: autoRevokeAllowed
                            type: boolean
                          deadline:
                            $id: '#sp:create-campaign/deadline'
                            default: ''
                            examples:
                            - '2020-12-25T06:00:00.468Z'
                            format: date-time
                            pattern: ^.*$
                            title: deadline
                            type: string
                          description:
                            $id: '#sp:create-campaign/description'
                            default: ''
                            examples:
                            - A review of everyone's access by their manager.
                            pattern: ^.*$
                            title: description
                            type: string
                          emailNotificationEnabled:
                            $id: '#sp:create-campaign/emailNotificationEnabled'
                            default: true
                            examples:
                            - false
                            title: emailNotificationEnabled
                            type: boolean
                          filter:
                            $id: '#sp:create-campaign/filter'
                            properties:
                              id:
                                $id: '#sp:create-campaign/filter/id'
                                default: ''
                                examples:
                                - e0adaae69852e8fe8b8a3d48e5ce757c
                                pattern: ^.*$
                                title: id
                                type: string
                              type:
                                $id: '#sp:create-campaign/filter/type'
                                default: ''
                                examples:
                                - CAMPAIGN_FILTER
                                pattern: ^.*$
                                title: type
                                type: string
                            title: filter
                            type: object
                          id:
                            $id: '#sp:create-campaign/id'
                            default: ''
                            examples:
                            - 2c918086719eec070171a7e3355a360a
                            pattern: ^.*$
                            title: id
                            type: string
                          name:
                            $id: '#sp:create-campaign/name'
                            default: ''
                            examples:
                            - Manager Review
                            pattern: ^.*$
                            title: name
                            type: string
                          recommendationsEnabled:
                            $id: '#sp:create-campaign/recommendationsEnabled'
                            default: true
                            examples:
                            - false
                            title: recommendationEnabled
                            type: boolean
                          type:
                            $id: '#sp:create-campaign/type'
                            default: ''
                            examples:
                            - MANAGER
                            pattern: ^.*$
                            title: type
                            type: string
                        title: sp:create-campaign
                        type: object
