  /workflow-executions/v1/{id}/history-v2:
    get:
      operationId: getWorkflowExecutionHistoryV2
      tags:
      - Workflows
      summary: Get updated workflow execution history
      description: Gets a workflow execution history, trigger input, and workflow
        definition of a single workflow execution.  Workflow executions are available
        for up to 90 days before being archived.  If you attempt to access a workflow
        execution that has been archived, you will receive a 404 Not Found.
      security:
      - userAuth:
        - sp:workflow:read
        - sp:workflow:manage
      x-sailpoint-userLevels:
      - ORG_ADMIN
      - SOURCE_SUBADMIN
      - SOURCE_ADMIN
      parameters:
      - name: id
        in: path
        description: Id of the workflow execution
        required: true
        x-sailpoint-resource-operation-id: getWorkflowExecutionsV1
        style: simple
        explode: false
        schema:
          type: string
          example: c17bea3a-574d-453c-9e04-4365fbf5af0b
      responses:
        '200':
          description: List of workflow workflow definition, execution events, and
            workflow trigger for the given workflow execution
          content:
            application/json:
              schema:
                type: object
                properties:
                  definition:
                    type: object
                    description: The map of steps that the workflow will execute.
                    properties:
                      start:
                        type: string
                        description: The name of the starting step.
                        example: Send Email Test
                      steps:
                        type: object
                        description: One or more step objects that comprise this workflow.  Please
                          see the Workflow documentation to see the JSON schema for
                          each step type.
                        additionalProperties: true
                        example:
                          Send Email:
                            actionId: sp:send-email
                            attributes:
                              body: This is a test
                              from: sailpoint@sailpoint.com
                              recipientId.$: $.identity.id
                              subject: test
                            nextStep: success
                            selectResult: null
                            type: ACTION
                          success:
                            type: success
                  history:
                    type: object
                    properties:
                      type:
                        type: string
                        description: The type of event
                        enum:
                        - WorkflowExecutionScheduled
                        - WorkflowExecutionStarted
                        - WorkflowExecutionCompleted
                        - WorkflowExecutionFailed
                        - WorkflowTaskScheduled
                        - WorkflowTaskStarted
                        - WorkflowTaskCompleted
                        - WorkflowTaskFailed
                        - ActivityTaskScheduled
                        - ActivityTaskStarted
                        - ActivityTaskCompleted
                        - ActivityTaskFailed
                        - StartChildWorkflowExecutionInitiated
                        - ChildWorkflowExecutionStarted
                        - ChildWorkflowExecutionCompleted
                        - ChildWorkflowExecutionFailed
                        example: WorkflowTaskScheduled
                      timestamp:
                        type: string
                        format: date-time
                        description: The date-time when the event occurred
                        example: '2022-02-07T20:13:31.640618296Z'
                      attributes:
                        type: object
                        description: Additional attributes associated with the event
                        example: {}
                    description: List of workflow execution events for the given workflow
                      execution
                  trigger:
                    type: object
                    description: The trigger that starts the workflow
                    required:
                    - type
                    - attributes
                    properties:
                      type:
                        type: string
                        enum:
                        - EVENT
                        - EXTERNAL
                        - SCHEDULED
                        - ''
                        example: EVENT
                        description: The trigger type
                      displayName:
                        type: string
                        nullable: true
                        description: The trigger display name
                      attributes:
                        nullable: true
                        anyOf:
                        - title: Event Trigger Attributes
                          type: object
                          description: Attributes related to an IdentityNow ETS event
                          additionalProperties: false
                          required:
                          - id
                          properties:
                            id:
                              type: string
                              description: The unique ID of the trigger
                              example: idn:identity-attributes-changed
                              nullable: true
                            filter.$:
                              type: string
                              description: JSON path expression that will limit which
                                events the trigger will fire on
                              example: $.changes[?(@.attribute == 'manager')]
                              nullable: true
                            description:
                              type: string
                              description: Description of the event trigger
                              example: Triggered when an identity's manager attribute
                                changes
                              nullable: true
                            attributeToFilter:
                              type: string
                              description: The attribute to filter on
                              example: LifecycleState
                              nullable: true
                            formDefinitionId:
                              type: string
                              description: Form definition's unique identifier.
                              example: Admin_Access_Request_Form
                              nullable: true
                        - title: External Trigger Attributes
                          type: object
                          description: Attributes related to an external trigger
                          additionalProperties: false
                          properties:
                            name:
                              type: string
                              description: A unique name for the external trigger
                              example: search-and-notify
                              nullable: true
                            description:
                              type: string
                              description: Additional context about the external trigger
                              example: Run a search and notify the results
                              nullable: true
                            clientId:
                              type: string
                              description: OAuth Client ID to authenticate with this
                                trigger
                              example: 87e239b2-b85b-4bde-b9a7-55bf304ddcdc
                              nullable: true
                            url:
                              type: string
                              description: URL to invoke this workflow
                              example: https://example-tenant.api.identitynow.com/workflows/v1/execute/external/c79e0079-562c-4df5-aa73-60a9e25c916d
                              nullable: true
                        - title: Scheduled Trigger Attributes
                          type: object
                          description: Attributes related to a scheduled trigger
                          additionalProperties: false
                          required:
                          - frequency
                          properties:
                            frequency:
                              type: string
                              description: Frequency of execution
                              example: daily
                              enum:
                              - daily
                              - weekly
                              - monthly
                              - yearly
                              - cronSchedule
                              - null
                              nullable: true
                            timeZone:
                              type: string
                              description: Time zone identifier
                              example: America/Chicago
                              nullable: true
                            cronString:
                              type: string
                              description: A valid CRON expression
                              externalDocs:
                                description: CRON expression editor
                                url: https://crontab.guru/
                              example: 0 9 * * 1
                              nullable: true
                            weeklyDays:
                              type: array
                              items:
                                type: string
                              example: Monday
                              description: Scheduled days of the week for execution
                              nullable: true
                            weeklyTimes:
                              type: array
                              items:
                                type: string
                              example: Monday
                              description: Scheduled execution times
                              nullable: true
                            yearlyTimes:
                              type: array
                              items:
                                type: string
                              example: '1969-12-31T09:00:00.000Z'
                              description: Scheduled execution times
                              nullable: true
                        description: Workflow Trigger Attributes.
