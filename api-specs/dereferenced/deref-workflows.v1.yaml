  /workflows/v1/{id}/executions:
    get:
      operationId: getWorkflowExecutionsV1
      tags:
      - Workflows
      summary: List workflow executions
      description: "[Deprecated] This endpoint will be removed in July 2028. Use this\
        \ API to list a specified workflow's executions. Workflow executions are available\
        \ for up to 90 days before being archived. By default, you can get a maximum\
        \ of 250 executions. To get executions past the first 250 records, you can\
        \ do the following:\n1. Use the [Get Workflows](https://developer.sailpoint.com/docs/api/list-workflows-v-1)\
        \ endpoint to get your workflows.\n2. Get your workflow ID from the response.\n\
        3. You can then do either of the following:\n\n  - Filter to find relevant\
        \ workflow executions.\n  For example, you can filter for failed workflow\
        \ executions: `GET /workflows/:workflowID/executions?filters=status eq \"\
        Failed\"`\n\n  - Paginate through results with the `offset` parameter.\n \
        \ For example, you can page through 50 executions per page and use that as\
        \ a way to get to the records past the first 250.\n  Refer to [Paginating\
        \ Results](https://developer.sailpoint.com/idn/api/standard-collection-parameters#paginating-results)\
        \ for more information about the query parameters you can use to achieve pagination."
      deprecated: true
      security:
      - userAuth:
        - sp:workflow:read
        - sp:workflow:manage
      x-sailpoint-userLevels:
      - ORG_ADMIN
      - SOURCE_SUBADMIN
      - SOURCE_ADMIN
      parameters:
      - name: id
        in: path
        description: Workflow ID.
        required: true
        x-sailpoint-resource-operation-id: listWorkflowsV1
        style: simple
        explode: false
        schema:
          type: string
          example: c17bea3a-574d-453c-9e04-4365fbf5af0b
      - in: query
        name: limit
        description: 'Max number of results to return.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: 250
        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 250
          default: 250
      - in: query
        name: offset
        description: 'Offset into the full result set. Usually specified with *limit*
          to paginate through the results.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: 0
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - in: query
        name: filters
        schema:
          type: string
        description: 'Filter results using the standard syntax described in [V3 API
          Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


          Filtering is supported for the following fields and operators:


          **start_time**: *eq, lt, le, gt, ge*


          **status**: *eq*'
        example: status eq "Failed"
        required: false
      responses:
        '200':
          description: List of workflow executions for the specified workflow.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Workflow execution ID.
                      example: b393f4e2-4785-4d7f-ab27-3a6b8ded4c81
                    workflowId:
                      type: string
                      description: Workflow ID.
                      example: d201c5d9-d37b-4a2f-af14-66414f39d568
