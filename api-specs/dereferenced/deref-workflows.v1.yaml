    patch:
      operationId: patchWorkflowV1
      tags:
      - Workflows
      summary: Patch workflow
      description: Partially update an existing Workflow using [JSON Patch](https://tools.ietf.org/html/rfc6902)
        syntax.
      security:
      - userAuth:
        - sp:workflow:manage
      parameters:
      - name: id
        in: path
        description: Id of the Workflow
        required: true
        x-sailpoint-resource-operation-id: listWorkflowsV1
        style: simple
        explode: false
        schema:
          type: string
          example: c17bea3a-574d-453c-9e04-4365fbf5af0b
      requestBody:
        required: true
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                type: object
                title: Json Patch Operation
                description: A JSONPatch Operation as defined by [RFC 6902 - JSON
                  Patch](https://tools.ietf.org/html/rfc6902)
                required:
                - op
                - path
                properties:
                  op:
                    type: string
                    description: The operation to be performed
                    enum:
                    - add
                    - remove
                    - replace
                    - move
                    - copy
                    - test
                    example: replace
                  path:
                    type: string
                    description: A string JSON Pointer representing the target path
                      to an element to be affected by the operation
                    example: /description
                  value:
                    oneOf:
                    - type: string
                      example: New description
                      title: string
                    - type: boolean
                      example: true
                      title: boolean
                    - type: integer
                      example: 300
                      title: integer
                    - type: object
                      title: object
                      example:
                        attributes:
                          name: philip
                    - type: array
                      title: array
                      items:
                        anyOf:
                        - type: string
                        - type: integer
                        - type: object
                        example:
                        - '001'
                        - '002'
                        - '003'
                    description: The value to be used for the operation, required
                      for "add" and "replace" operations
                    example: New description
            examples:
              Update all patchable fields:
                description: Demonstrate how to update each patchable field in one
                  PATCH request.
                value:
                - op: replace
                  path: /name
                  value: Send Email
                - op: replace
                  path: /owner
                  value:
                    type: IDENTITY
                    id: 2c91808568c529c60168cca6f90c1313
                    name: William Wilson
                - op: replace
                  path: /description
                  value: Send an email to the identity who's attributes changed.
                - op: replace
                  path: /enabled
                  value: false
                - op: replace
                  path: /definition
                  value:
                    start: Send Email Test
                    steps:
                      Send Email:
                        actionId: sp:send-email
                        attributes:
                          body: This is a test
                          from: sailpoint@sailpoint.com
                          recipientId.$: $.identity.id
                          subject: test
                        nextStep: success
                        selectResult: null
                        type: action
                      success:
                        type: success
                - op: replace
                  path: /trigger
                  value:
                    type: EVENT
                    attributes:
                      id: idn:identity-attributes-changed
      responses:
        '200':
          description: The Workflow object
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Workflow ID. This is a UUID generated upon creation.
                    example: d201c5e9-d37b-4aff-af14-66414f39d569
                  executionCount:
                    type: integer
                    format: int32
                    description: The number of times this workflow has been executed.
                    example: 2
                  failureCount:
                    type: integer
                    format: int32
                    description: The number of times this workflow has failed during
                      execution.
                    example: 0
                  created:
                    type: string
                    format: date-time
                    description: The date and time the workflow was created.
                    example: '2022-01-10T16:06:16.636381447Z'
                  modified:
                    type: string
                    format: date-time
                    description: The date and time the workflow was modified.
                    example: '2023-12-05T15:18:27.699132301Z'
                  modifiedBy:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - IDENTITY
                        example: IDENTITY
                      id:
                        type: string
                        description: Identity ID
                        example: 2c9180a46faadee4016fb4e018c20639
                      name:
                        type: string
                        description: Human-readable display name of identity.
                        example: Thomas Edison
                  creator:
                    type: object
                    description: Workflow creator's identity.
                    properties:
                      type:
                        type: string
                        description: Workflow creator's DTO type.
                        enum:
                        - IDENTITY
                        example: IDENTITY
                      id:
                        type: string
                        description: Workflow creator's identity ID.
                        example: 2c7180a46faadee4016fb4e018c20642
                      name:
                        type: string
                        description: Workflow creator's display name.
                        example: Michael Michaels
                  name:
                    type: string
                    description: The name of the workflow
                    example: Send Email
                  owner:
                    type: object
                    description: The identity that owns the workflow.  The owner's
                      permissions in IDN will determine what actions the workflow
                      is allowed to perform.  Ownership can be changed by updating
                      the owner in a PUT or PATCH request.
                    properties:
                      type:
                        type: string
                        enum:
                        - IDENTITY
                        example: IDENTITY
                        description: The type of object that is referenced
                      id:
                        type: string
                        description: The unique ID of the object
                        example: 2c91808568c529c60168cca6f90c1313
                      name:
                        type: string
                        description: The name of the object
                        example: William Wilson
                  description:
                    type: string
                    description: Description of what the workflow accomplishes
                    example: Send an email to the identity who's attributes changed.
                  definition:
                    type: object
                    description: The map of steps that the workflow will execute.
                    properties:
                      start:
                        type: string
                        description: The name of the starting step.
                        example: Send Email Test
                      steps:
                        type: object
                        description: One or more step objects that comprise this workflow.  Please
                          see the Workflow documentation to see the JSON schema for
                          each step type.
                        additionalProperties: true
                        example:
                          Send Email:
                            actionId: sp:send-email
                            attributes:
                              body: This is a test
                              from: sailpoint@sailpoint.com
                              recipientId.$: $.identity.id
                              subject: test
                            nextStep: success
                            selectResult: null
                            type: ACTION
                          success:
                            type: success
                  enabled:
                    type: boolean
                    description: Enable or disable the workflow.  Workflows cannot
                      be created in an enabled state.
                    default: false
                    example: false
                  trigger:
                    type: object
                    description: The trigger that starts the workflow
                    required:
                    - type
                    - attributes
                    properties:
                      type:
                        type: string
                        enum:
                        - EVENT
                        - EXTERNAL
                        - SCHEDULED
                        - ''
                        example: EVENT
                        description: The trigger type
                      displayName:
                        type: string
                        nullable: true
                        description: The trigger display name
                      attributes:
                        nullable: true
                        anyOf:
                        - title: Event Trigger Attributes
                          type: object
                          description: Attributes related to an IdentityNow ETS event
                          additionalProperties: false
                          required:
                          - id
                          properties:
                            id:
                              type: string
                              description: The unique ID of the trigger
                              example: idn:identity-attributes-changed
                              nullable: true
                            filter.$:
                              type: string
                              description: JSON path expression that will limit which
                                events the trigger will fire on
                              example: $.changes[?(@.attribute == 'manager')]
                              nullable: true
                            description:
                              type: string
                              description: Description of the event trigger
                              example: Triggered when an identity's manager attribute
                                changes
                              nullable: true
                            attributeToFilter:
                              type: string
                              description: The attribute to filter on
                              example: LifecycleState
                              nullable: true
                            formDefinitionId:
                              type: string
                              description: Form definition's unique identifier.
                              example: Admin_Access_Request_Form
                              nullable: true
                        - title: External Trigger Attributes
                          type: object
                          description: Attributes related to an external trigger
                          additionalProperties: false
                          properties:
                            name:
                              type: string
                              description: A unique name for the external trigger
                              example: search-and-notify
                              nullable: true
                            description:
                              type: string
                              description: Additional context about the external trigger
                              example: Run a search and notify the results
                              nullable: true
                            clientId:
                              type: string
                              description: OAuth Client ID to authenticate with this
                                trigger
                              example: 87e239b2-b85b-4bde-b9a7-55bf304ddcdc
                              nullable: true
                            url:
                              type: string
                              description: URL to invoke this workflow
                              example: https://example-tenant.api.identitynow.com/workflows/v1/execute/external/c79e0079-562c-4df5-aa73-60a9e25c916d
                              nullable: true
                        - title: Scheduled Trigger Attributes
                          type: object
                          description: Attributes related to a scheduled trigger
                          additionalProperties: false
                          required:
                          - frequency
                          properties:
                            frequency:
                              type: string
                              description: Frequency of execution
                              example: daily
                              enum:
                              - daily
                              - weekly
                              - monthly
                              - yearly
                              - cronSchedule
                              - null
                              nullable: true
                            timeZone:
                              type: string
                              description: Time zone identifier
                              example: America/Chicago
                              nullable: true
                            cronString:
                              type: string
                              description: A valid CRON expression
                              externalDocs:
                                description: CRON expression editor
                                url: https://crontab.guru/
                              example: 0 9 * * 1
                              nullable: true
                            weeklyDays:
                              type: array
                              items:
                                type: string
                              example: Monday
                              description: Scheduled days of the week for execution
                              nullable: true
                            weeklyTimes:
                              type: array
                              items:
                                type: string
                              example: Monday
                              description: Scheduled execution times
                              nullable: true
                            yearlyTimes:
                              type: array
                              items:
                                type: string
                              example: '1969-12-31T09:00:00.000Z'
                              description: Scheduled execution times
                              nullable: true
                        description: Workflow Trigger Attributes.
