                                key:
                                  type: object
                                  nullable: true
                                  description: 'Refers to a specific Identity attribute, Account attibute, or Entitlement used in Role membership criteria'
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                        - IDENTITY
                                        - ACCOUNT
