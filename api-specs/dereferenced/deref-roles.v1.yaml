        - Roles
      security:
        - userAuth:
            - 'idn:role:update'
            - 'idn:role-checked:update'
      x-sailpoint-userLevels:
        - ORG_ADMIN
        - ROLE_ADMIN
        - ROLE_SUBADMIN
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The Id of a role
          example: c24359c389374d0fb8585698a2189e3d
        - name: attributeKey
          in: path
          required: true
          schema:
            type: string
          description: Technical name of the Attribute.
          example: iscPrivacy
        - name: attributeValue
          in: path
          required: true
          schema:
            type: string
          description: Technical name of the Attribute Value.
          example: public
