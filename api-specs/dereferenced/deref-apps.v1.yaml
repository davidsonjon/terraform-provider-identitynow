  /user-apps/v1/{id}:
    patch:
      operationId: patchUserAppV1
      tags:
      - Apps
      summary: Patch user app by id
      description: 'This API updates an existing user app using [JSON Patch](https://tools.ietf.org/html/rfc6902)
        syntax.

        The following fields are patchable: **account**'
      security:
      - userAuth:
        - idn:app-roles:manage
      parameters:
      - name: id
        in: path
        description: ID of the user app to patch
        required: true
        x-sailpoint-resource-operation-id: listAllUserAppsV1
        schema:
          type: string
          example: 2c91808a7813090a017814121e121518
      - name: X-SailPoint-Experimental
        in: header
        description: Use this header to enable this experimental API.
        example: true
        schema:
          type: string
          default: true
        required: true
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                type: object
                title: Json Patch Operation
                description: A JSONPatch Operation as defined by [RFC 6902 - JSON
                  Patch](https://tools.ietf.org/html/rfc6902)
                required:
                - op
                - path
                properties:
                  op:
                    type: string
                    description: The operation to be performed
                    enum:
                    - add
                    - remove
                    - replace
                    - move
                    - copy
                    - test
                    example: replace
                  path:
                    type: string
                    description: A string JSON Pointer representing the target path
                      to an element to be affected by the operation
                    example: /description
                  value:
                    oneOf:
                    - type: string
                      example: New description
                      title: string
                    - type: boolean
                      example: true
                      title: boolean
                    - type: integer
                      example: 300
                      title: integer
                    - type: object
                      title: object
                      example:
                        attributes:
                          name: philip
                    - type: array
                      title: array
                      items:
                        anyOf:
                        - type: string
                        - type: integer
                        - type: object
                        example:
                        - '001'
                        - '002'
                        - '003'
                    description: The value to be used for the operation, required
                      for "add" and "replace" operations
                    example: New description
              example:
              - op: replace
                path: /account
                value:
                  id: 0891808a7813090a017814121e121518
                  type: ACCOUNT
      responses:
        '200':
          description: Responds with the user app as updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The user app id
                    example: 2c91808874ff91550175097daaec161c
                  created:
                    type: string
                    description: Time when the user app was created
                    format: date-time
                    example: '2020-10-08T18:33:52.029Z'
                  modified:
                    type: string
                    description: Time when the user app was last modified
                    format: date-time
                    example: '2020-10-08T18:33:52.029Z'
                  hasMultipleAccounts:
                    type: boolean
                    default: false
                    description: True if the owner has multiple accounts for the source
                    example: false
                  useForPasswordManagement:
                    type: boolean
                    default: false
                    description: True if the source has password feature
                    example: true
                  provisionRequestEnabled:
                    type: boolean
                    default: false
                    description: True if the app allows access request
                    example: true
                  appCenterEnabled:
                    type: boolean
                    default: true
                    description: True if the app is visible in the request center
                    example: true
                  sourceApp:
                    type: object
                    properties:
                      id:
                        type: string
                        description: the source app ID
                        example: edcb0951812949d085b60cd8bf35bc78
                      type:
                        type: string
                        description: It will always be "APPLICATION"
                        example: APPLICATION
                      name:
                        type: string
                        description: the source app name
                        example: test-app
                  source:
                    type: object
                    properties:
                      id:
                        type: string
                        description: the source ID
                        example: 9870808a7190d06e01719938fcd20792
                      type:
                        type: string
                        description: It will always be "SOURCE"
                        example: SOURCE
                      name:
                        type: string
                        description: the source name
                        example: test-source
                  account:
                    type: object
                    properties:
                      id:
                        type: string
                        description: the account ID
                        example: 85d173e7d57e496569df763231d6deb6a
                      type:
                        type: string
                        description: It will always be "ACCOUNT"
                        example: ACCOUNT
                      name:
                        type: string
                        description: the account name
                        example: test account
                  owner:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The identity ID
                        example: 2c9180827ca885d7017ca8ce28a000eb
                      type:
                        type: string
                        description: It will always be "IDENTITY"
                        example: IDENTITY
                      name:
                        type: string
                        description: The identity name
                        example: John
                      alias:
                        type: string
                        description: The identity alias
                        example: John.Doe
