  /source-apps/v1:
    get:
      operationId: listAvailableSourceAppsV1
      tags:
      - Apps
      summary: List available source apps
      security:
      - userAuth:
        - idn:app-roles:read
        - idn:app-roles:manage
      description: This API returns the list of source apps available for access request.
      parameters:
      - in: query
        name: limit
        description: 'Max number of results to return.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: 250
        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 250
          default: 250
      - in: query
        name: count
        description: 'If *true* it will populate the *X-Total-Count* response header
          with the number of results that would be returned if *limit* and *offset*
          were ignored.


          Since requesting a total count can have a performance impact, it is recommended
          not to send **count=true** if that value will not be used.


          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: true
        schema:
          type: boolean
          default: false
      - in: query
        name: offset
        description: 'Offset into the full result set. Usually specified with *limit*
          to paginate through the results.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: 0
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - in: query
        name: sorters
        schema:
          type: string
          format: comma-separated
        description: 'Sort results using the standard syntax described in [V3 API
          Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#sorting-results)


          Sorting is supported for the following fields: **id, name, created, modified,
          owner.id, accountSource.id**'
        example: name,-modified
        required: false
        style: form
        explode: true
      - in: query
        name: filters
        schema:
          type: string
        description: 'Filter results using the standard syntax described in [V3 API
          Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


          Filtering is supported for the following fields and operators:


          **id**: *eq, in*


          **name**: *eq, in, co, sw*


          **created**: *gt, lt, ge, le*


          **modified**: *gt, lt, ge, le*


          **accountSource.id**: *eq, in*'
        example: name eq "source app name"
        required: false
        style: form
        explode: true
      - name: X-SailPoint-Experimental
        in: header
        description: Use this header to enable this experimental API.
        example: true
        schema:
          type: string
          default: true
        required: true
      responses:
        '200':
          description: List of source apps
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: The source app id
                      example: 2c91808874ff91550175097daaec161c
                    cloudAppId:
                      type: string
                      description: The deprecated source app id
                      example: '9854520'
                    name:
                      type: string
                      description: The source app name
                      example: my app
                    created:
                      type: string
                      description: Time when the source app was created
                      format: date-time
                      example: '2020-10-08T18:33:52.029Z'
                    modified:
                      type: string
                      description: Time when the source app was last modified
                      format: date-time
                      example: '2020-10-08T18:33:52.029Z'
                    enabled:
                      type: boolean
                      default: false
                      description: True if the source app is enabled
                      example: true
                    provisionRequestEnabled:
                      type: boolean
                      default: false
                      description: True if the app allows access request
                      example: true
                    description:
                      type: string
                      nullable: false
                      description: The description of the source app
                      example: the source app for engineers
                    matchAllAccounts:
                      type: boolean
                      default: false
                      description: True if the source app match all accounts
                      example: true
                    appCenterEnabled:
                      type: boolean
                      default: true
                      description: True if the app is visible in the request center
                      example: true
                    accountSource:
                      type: object
                      nullable: true
                      properties:
                        id:
                          type: string
                          description: The source ID
                          example: 2c9180827ca885d7017ca8ce28a000eb
                        type:
                          type: string
                          description: The source type, will always be "SOURCE"
                          example: SOURCE
                        name:
                          type: string
                          description: The source name
                          example: ODS-AD-Source
                        useForPasswordManagement:
                          type: boolean
                          default: false
                          description: If the source is used for password management
                          example: ture
                        passwordPolicies:
                          type: array
                          nullable: true
                          description: The password policies for the source
                          items:
                            type: object
                            title: Base Reference Dto
                            properties:
                              type:
                                description: DTO type
                                type: string
                                enum:
                                - ACCOUNT_CORRELATION_CONFIG
                                - ACCESS_PROFILE
                                - ACCESS_REQUEST_APPROVAL
                                - ACCOUNT
                                - APPLICATION
                                - CAMPAIGN
                                - CAMPAIGN_FILTER
                                - CERTIFICATION
                                - CLUSTER
