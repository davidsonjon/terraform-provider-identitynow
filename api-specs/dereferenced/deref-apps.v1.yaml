        name: limit
        description: 'Max number of results to return.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: 250
        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 250
          default: 250
      - in: query
        name: count
        description: 'If *true* it will populate the *X-Total-Count* response header
          with the number of results that would be returned if *limit* and *offset*
          were ignored.


          Since requesting a total count can have a performance impact, it is recommended
          not to send **count=true** if that value will not be used.


          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: true
        schema:
          type: boolean
          default: false
      - in: query
        name: offset
        description: 'Offset into the full result set. Usually specified with *limit*
          to paginate through the results.

          See [V3 API Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters)
          for more information.'
        required: false
        example: 0
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - in: query
        name: filters
        schema:
          type: string
        description: 'Filter results using the standard syntax described in [V3 API
          Standard Collection Parameters](https://developer.sailpoint.com/idn/api/standard-collection-parameters#filtering-results)


          Filtering is supported for the following fields and operators:


          **id**: *eq*


          **ownerId**: *eq*


          **ownerName**: *eq, sw*


          **ownerAlias**: *eq, sw*


          **accountId**: *eq*


          **sourceAppId**: *eq*'
        example: name eq "user app name"
        required: true
        style: form
        explode: true
      - name: X-SailPoint-Experimental
        in: header
        description: Use this header to enable this experimental API.
        example: true
        schema:
          type: string
          default: true
        required: true
      responses:
        '200':
          description: List of user apps
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: The user app id
                      example: 2c91808874ff91550175097daaec161c
                    created:
                      type: string
                      description: Time when the user app was created
                      format: date-time
                      example: '2020-10-08T18:33:52.029Z'
                    modified:
                      type: string
                      description: Time when the user app was last modified
                      format: date-time
                      example: '2020-10-08T18:33:52.029Z'
                    hasMultipleAccounts:
                      type: boolean
                      default: false
                      description: True if the owner has multiple accounts for the
                        source
                      example: false
                    useForPasswordManagement:
                      type: boolean
                      default: false
                      description: True if the source has password feature
                      example: true
                    provisionRequestEnabled:
                      type: boolean
                      default: false
                      description: True if the app allows access request
                      example: true
                    appCenterEnabled:
                      type: boolean
                      default: true
                      description: True if the app is visible in the request center
                      example: true
                    sourceApp:
                      type: object
                      properties:
                        id:
                          type: string
                          description: the source app ID
                          example: edcb0951812949d085b60cd8bf35bc78
                        type:
                          type: string
                          description: It will always be "APPLICATION"
                          example: APPLICATION
                        name:
                          type: string
                          description: the source app name
                          example: test-app
                    source:
                      type: object
                      properties:
                        id:
                          type: string
                          description: the source ID
                          example: 9870808a7190d06e01719938fcd20792
                        type:
                          type: string
                          description: It will always be "SOURCE"
                          example: SOURCE
                        name:
                          type: string
                          description: the source name
                          example: test-source
                    account:
                      type: object
                      properties:
                        id:
                          type: string
                          description: the account ID
                          example: 85d173e7d57e496569df763231d6deb6a
                        type:
                          type: string
                          description: It will always be "ACCOUNT"
                          example: ACCOUNT
                        name:
                          type: string
                          description: the account name
                          example: test account
                    owner:
