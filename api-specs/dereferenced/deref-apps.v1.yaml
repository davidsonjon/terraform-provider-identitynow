openapi: 3.0.1
info:
  title: Identity Security Cloud API - Apps
  description: Use these APIs to interact with the Identity Security Cloud platform
    to achieve repeatable, automated processes with greater scalability. We encourage
    you to join the SailPoint Developer Community forum at https://developer.sailpoint.com/discuss
    to connect with other developers using our APIs.
  termsOfService: https://developer.sailpoint.com/discuss/tos
  contact:
    name: Developer Relations
    url: https://developer.sailpoint.com/discuss/api-help
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: v1
servers:
- url: https://{tenant}.api.identitynow.com
  description: This is the production API server.
  variables:
    tenant:
      default: sailpoint
      description: This is the name of your tenant, typically your company's name.
- url: https://{apiUrl}
  description: This is the versioned API server.
  variables:
    apiUrl:
      default: sailpoint.api.identitynow.com
      description: This is the api url of your tenant
tags:
- name: Apps
  description: "Use this API to implement source application functionality. \nWith\
    \ this functionality in place, you can create, customize, and manage applications\
    \ within sources.\n"
paths:
  /source-apps/v1/{id}:
    get:
      operationId: getSourceAppV1
      tags:
      - Apps
      summary: Get source app by id
      description: This API returns a source app by its ID.
      security:
      - userAuth:
        - idn:app-roles:read
        - idn:app-roles:manage
      parameters:
      - name: id
        in: path
        description: ID of the source app
        required: true
        x-sailpoint-resource-operation-id: listAllSourceAppV1
        schema:
          type: string
          example: 2c91808a7813090a017814121e121518
      - name: X-SailPoint-Experimental
        in: header
        description: Use this header to enable this experimental API.
        example: true
        schema:
          type: string
          default: true
        required: true
      responses:
        '200':
          description: Responds with the source app.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The source app id
                    example: 2c91808874ff91550175097daaec161c
                  cloudAppId:
                    type: string
                    description: The deprecated source app id
                    example: '9854520'
                  name:
                    type: string
                    description: The source app name
                    example: my app
                  created:
                    type: string
                    description: Time when the source app was created
                    format: date-time
                    example: '2020-10-08T18:33:52.029Z'
                  modified:
                    type: string
                    description: Time when the source app was last modified
                    format: date-time
                    example: '2020-10-08T18:33:52.029Z'
                  enabled:
                    type: boolean
                    default: false
                    description: True if the source app is enabled
                    example: true
                  provisionRequestEnabled:
                    type: boolean
                    default: false
                    description: True if the app allows access request
                    example: true
                  description:
                    type: string
                    nullable: false
                    description: The description of the source app
                    example: the source app for engineers
                  matchAllAccounts:
                    type: boolean
                    default: false
                    description: True if the source app match all accounts
                    example: true
                  appCenterEnabled:
                    type: boolean
                    default: true
                    description: True if the app is visible in the request center
                    example: true
                  accountSource:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                        description: The source ID
                        example: 2c9180827ca885d7017ca8ce28a000eb
                      type:
                        type: string
                        description: The source type, will always be "SOURCE"
                        example: SOURCE
                      name:
                        type: string
                        description: The source name
                        example: ODS-AD-Source
                      useForPasswordManagement:
                        type: boolean
                        default: false
                        description: If the source is used for password management
                        example: ture
                      passwordPolicies:
                        type: array
                        nullable: true
                        description: The password policies for the source
                        items:
                          type: object
                          title: Base Reference Dto
                          properties:
                            type:
                              description: DTO type
                              type: string
                              enum:
                              - ACCOUNT_CORRELATION_CONFIG
                              - ACCESS_PROFILE
                              - ACCESS_REQUEST_APPROVAL
                              - ACCOUNT
                              - APPLICATION
                              - CAMPAIGN
                              - CAMPAIGN_FILTER
                              - CERTIFICATION
                              - CLUSTER
                              - CONNECTOR_SCHEMA
                              - ENTITLEMENT
                              - GOVERNANCE_GROUP
                              - IDENTITY
                              - IDENTITY_PROFILE
                              - IDENTITY_REQUEST
                              - MACHINE_IDENTITY
                              - LIFECYCLE_STATE
                              - PASSWORD_POLICY
                              - ROLE
                              - RULE
                              - SOD_POLICY
                              - SOURCE
                              - TAG
                              - TAG_CATEGORY
                              - TASK_RESULT
                              - REPORT_RESULT
                              - SOD_VIOLATION
                              - ACCOUNT_ACTIVITY
                              - WORKGROUP
                              example: IDENTITY
                            id:
                              type: string
                              description: ID of the object to which this reference
                                applies
                              example: 2c91808568c529c60168cca6f90c1313
                            name:
                              type: string
                              description: Human-readable display name of the object
                                to which this reference applies
                              example: William Wilson
                        example:
                        - type: PASSWORD_POLICY
                          id: 006a072ecc6647f68bba9f4a4ad34649
                          name: Password Policy 1
                  owner:
                    type: object
                    title: Base Reference Dto
                    properties:
                      type:
                        description: DTO type
                        type: string
                        enum:
                        - ACCOUNT_CORRELATION_CONFIG
                        - ACCESS_PROFILE
                        - ACCESS_REQUEST_APPROVAL
                        - ACCOUNT
                        - APPLICATION
                        - CAMPAIGN
                        - CAMPAIGN_FILTER
                        - CERTIFICATION
                        - CLUSTER
                        - CONNECTOR_SCHEMA
                        - ENTITLEMENT
                        - GOVERNANCE_GROUP
                        - IDENTITY
                        - IDENTITY_PROFILE
                        - IDENTITY_REQUEST
                        - MACHINE_IDENTITY
                        - LIFECYCLE_STATE
                        - PASSWORD_POLICY
                        - ROLE
                        - RULE
                        - SOD_POLICY
                        - SOURCE
                        - TAG
                        - TAG_CATEGORY
                        - TASK_RESULT
                        - REPORT_RESULT
                        - SOD_VIOLATION
                        - ACCOUNT_ACTIVITY
                        - WORKGROUP
                        example: IDENTITY
                      id:
                        type: string
                        description: ID of the object to which this reference applies
                        example: 2c91808568c529c60168cca6f90c1313
                      name:
                        type: string
                        description: Human-readable display name of the object to
                          which this reference applies
                        example: William Wilson
                    nullable: true
                    description: The owner of source app
                    example:
                      id: 85d173e7d57e496569df763231d6deb6a
                      type: IDENTITY
                      name: John Doe
        '400':
          description: Client Error - Returned if the request body is invalid.
          content:
            application/json:
              schema:
                type: object
                title: Error Response Dto
                properties:
                  detailCode:
                    type: string
                    description: Fine-grained error code providing more detail of
                      the error.
                    example: 400.1 Bad Request Content
                  trackingId:
                    type: string
                    description: Unique tracking id for the error.
                    example: e7eab60924f64aa284175b9fa3309599
                  messages:
                    type: array
                    description: Generic localized reason for error
                    items:
                      type: object
                      title: Error Message Dto
                      properties:
                        locale:
                          type: string
                          description: The locale for the message text, a BCP 47 language
                            tag.
                          example: en-US
                          nullable: true
                        localeOrigin:
                          type: string
                          enum:
                          - DEFAULT
                          - REQUEST
                          - null
                          description: An indicator of how the locale was selected.
                            *DEFAULT* means the locale is the system default. *REQUEST*
                            means the locale was selected from the request context
                            (i.e., best match based on the *Accept-Language* header).
                            Additional values may be added in the future without notice.
                          example: DEFAULT
                          nullable: true
                        text:
                          type: string
                          description: Actual text of the error message in the indicated
                            locale.
                          example: The request was syntactically correct but its content
                            is semantically invalid.
                  causes:
                    type: array
                    description: Plain-text descriptive reasons to provide additional
                      detail to the text provided in the messages field
                    items:
                      type: object
                      title: Error Message Dto
                      properties:
                        locale:
                          type: string
                          description: The locale for the message text, a BCP 47 language
                            tag.
                          example: en-US
                          nullable: true
                        localeOrigin:
                          type: string
                          enum:
                          - DEFAULT
                          - REQUEST
                          - null
                          description: An indicator of how the locale was selected.
                            *DEFAULT* means the locale is the system default. *REQUEST*
                            means the locale was selected from the request context
                            (i.e., best match based on the *Accept-Language* header).
                            Additional values may be added in the future without notice.
                          example: DEFAULT
                          nullable: true
                        text:
                          type: string
                          description: Actual text of the error message in the indicated
                            locale.
                          example: The request was syntactically correct but its content
                            is semantically invalid.
        '401':
          description: Unauthorized - Returned if there is no authorization header,
            or if the JWT token is expired.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: A message describing the error
                    example: 'JWT validation failed: JWT is expired'
        '403':
          description: Forbidden - Returned if the user you are running as, doesn't
            have access to this end-point.
          content:
            application/json:
              schema:
                type: object
                title: Error Response Dto
                properties:
                  detailCode:
                    type: string
                    description: Fine-grained error code providing more detail of
                      the error.
                    example: 400.1 Bad Request Content
                  trackingId:
                    type: string
                    description: Unique tracking id for the error.
                    example: e7eab60924f64aa284175b9fa3309599
                  messages:
                    type: array
                    description: Generic localized reason for error
                    items:
                      type: object
                      title: Error Message Dto
                      properties:
                        locale:
                          type: string
                          description: The locale for the message text, a BCP 47 language
                            tag.
                          example: en-US
                          nullable: true
                        localeOrigin:
                          type: string
                          enum:
                          - DEFAULT
                          - REQUEST
                          - null
                          description: An indicator of how the locale was selected.
                            *DEFAULT* means the locale is the system default. *REQUEST*
                            means the locale was selected from the request context
                            (i.e., best match based on the *Accept-Language* header).
                            Additional values may be added in the future without notice.
                          example: DEFAULT
                          nullable: true
                        text:
                          type: string
                          description: Actual text of the error message in the indicated
                            locale.
                          example: The request was syntactically correct but its content
                            is semantically invalid.
                  causes:
                    type: array
                    description: Plain-text descriptive reasons to provide additional
                      detail to the text provided in the messages field
                    items:
                      type: object
                      title: Error Message Dto
                      properties:
                        locale:
                          type: string
                          description: The locale for the message text, a BCP 47 language
                            tag.
                          example: en-US
                          nullable: true
                        localeOrigin:
                          type: string
                          enum:
                          - DEFAULT
                          - REQUEST
                          - null
                          description: An indicator of how the locale was selected.
                            *DEFAULT* means the locale is the system default. *REQUEST*
                            means the locale was selected from the request context
                            (i.e., best match based on the *Accept-Language* header).
                            Additional values may be added in the future without notice.
                          example: DEFAULT
                          nullable: true
                        text:
                          type: string
                          description: Actual text of the error message in the indicated
                            locale.
                          example: The request was syntactically correct but its content
                            is semantically invalid.
              examples:
                '403':
                  summary: An example of a 403 response object
                  value:
                    detailCode: 403 Forbidden
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server understood the request but refuses to authorize
                        it.
        '404':
          description: Not Found - returned if the request URL refers to a resource
            or object that does not exist
          content:
            application/json:
              schema:
                type: object
                title: Error Response Dto
                properties:
                  detailCode:
                    type: string
                    description: Fine-grained error code providing more detail of
                      the error.
                    example: 400.1 Bad Request Content
                  trackingId:
                    type: string
                    description: Unique tracking id for the error.
                    example: e7eab60924f64aa284175b9fa3309599
                  messages:
                    type: array
                    description: Generic localized reason for error
                    items:
                      type: object
                      title: Error Message Dto
                      properties:
                        locale:
                          type: string
                          description: The locale for the message text, a BCP 47 language
                            tag.
                          example: en-US
                          nullable: true
                        localeOrigin:
                          type: string
                          enum:
                          - DEFAULT
                          - REQUEST
                          - null
                          description: An indicator of how the locale was selected.
                            *DEFAULT* means the locale is the system default. *REQUEST*
                            means the locale was selected from the request context
                            (i.e., best match based on the *Accept-Language* header).
                            Additional values may be added in the future without notice.
                          example: DEFAULT
                          nullable: true
                        text:
                          type: string
                          description: Actual text of the error message in the indicated
                            locale.
                          example: The request was syntactically correct but its content
                            is semantically invalid.
                  causes:
                    type: array
                    description: Plain-text descriptive reasons to provide additional
                      detail to the text provided in the messages field
                    items:
                      type: object
                      title: Error Message Dto
                      properties:
                        locale:
                          type: string
                          description: The locale for the message text, a BCP 47 language
                            tag.
                          example: en-US
                          nullable: true
                        localeOrigin:
                          type: string
                          enum:
                          - DEFAULT
                          - REQUEST
                          - null
                          description: An indicator of how the locale was selected.
                            *DEFAULT* means the locale is the system default. *REQUEST*
                            means the locale was selected from the request context
                            (i.e., best match based on the *Accept-Language* header).
                            Additional values may be added in the future without notice.
                          example: DEFAULT
                          nullable: true
                        text:
                          type: string
                          description: Actual text of the error message in the indicated
                            locale.
                          example: The request was syntactically correct but its content
                            is semantically invalid.
              examples:
                '404':
                  summary: An example of a 404 response object
                  value:
                    detailCode: 404 Not found
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: The server did not find a current representation for the
                        target resource.
        '429':
          description: Too Many Requests - Returned in response to too many requests
            in a given period of time - rate limited. The Retry-After header in the
            response includes how long to wait before trying again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    description: A message describing the error
                    example: ' Rate Limit Exceeded '
        '500':
          description: Internal Server Error - Returned if there is an unexpected
            error.
          content:
            application/json:
              schema:
                type: object
                title: Error Response Dto
                properties:
                  detailCode:
                    type: string
                    description: Fine-grained error code providing more detail of
                      the error.
                    example: 400.1 Bad Request Content
                  trackingId:
                    type: string
                    description: Unique tracking id for the error.
                    example: e7eab60924f64aa284175b9fa3309599
                  messages:
                    type: array
                    description: Generic localized reason for error
                    items:
                      type: object
                      title: Error Message Dto
                      properties:
                        locale:
                          type: string
                          description: The locale for the message text, a BCP 47 language
                            tag.
                          example: en-US
                          nullable: true
                        localeOrigin:
                          type: string
                          enum:
                          - DEFAULT
                          - REQUEST
                          - null
                          description: An indicator of how the locale was selected.
                            *DEFAULT* means the locale is the system default. *REQUEST*
                            means the locale was selected from the request context
                            (i.e., best match based on the *Accept-Language* header).
                            Additional values may be added in the future without notice.
                          example: DEFAULT
                          nullable: true
                        text:
                          type: string
                          description: Actual text of the error message in the indicated
                            locale.
                          example: The request was syntactically correct but its content
                            is semantically invalid.
                  causes:
                    type: array
                    description: Plain-text descriptive reasons to provide additional
                      detail to the text provided in the messages field
                    items:
                      type: object
                      title: Error Message Dto
                      properties:
                        locale:
                          type: string
                          description: The locale for the message text, a BCP 47 language
                            tag.
                          example: en-US
                          nullable: true
                        localeOrigin:
                          type: string
                          enum:
                          - DEFAULT
                          - REQUEST
                          - null
                          description: An indicator of how the locale was selected.
                            *DEFAULT* means the locale is the system default. *REQUEST*
                            means the locale was selected from the request context
                            (i.e., best match based on the *Accept-Language* header).
                            Additional values may be added in the future without notice.
                          example: DEFAULT
                          nullable: true
                        text:
                          type: string
                          description: Actual text of the error message in the indicated
                            locale.
                          example: The request was syntactically correct but its content
                            is semantically invalid.
              examples:
                '500':
                  summary: An example of a 500 response object
                  value:
                    detailCode: 500.0 Internal Fault
                    trackingId: b21b1f7ce4da4d639f2c62a57171b427
                    messages:
                    - locale: en-US
                      localeOrigin: DEFAULT
                      text: An internal fault occurred.
    patch:
      operationId: patchSourceAppV1
      tags:
      - Apps
      summary: Patch source app by id
      description: 'This API updates an existing source app using [JSON Patch](https://tools.ietf.org/html/rfc6902)
        syntax.

        The following fields are patchable: **name**, **description**, **enabled**,
        **owner**, **provisionRequestEnabled**, **appCenterEnabled**, **accountSource**,  **matchAllAccounts**
        and **accessProfiles**.

        Name, description and owner can''t be empty or null.'
      security:
      - userAuth:
        - idn:app-roles:manage
      parameters:
      - name: id
        in: path
        description: ID of the source app to patch
        required: true
        x-sailpoint-resource-operation-id: listAllSourceAppV1
        schema:
          type: string
          example: 2c91808a7813090a017814121e121518
      - name: X-SailPoint-Experimental
        in: header
        description: Use this header to enable this experimental API.
        example: true
        schema:
          type: string
          default: true
        required: true
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                type: object
                title: Json Patch Operation
                description: A JSONPatch Operation as defined by [RFC 6902 - JSON
                  Patch](https://tools.ietf.org/html/rfc6902)
                required:
                - op
                - path
                properties:
                  op:
                    type: string
                    description: The operation to be performed
                    enum:
                    - add
                    - remove
                    - replace
                    - move
                    - copy
                    - test
                    example: replace
                  path:
                    type: string
                    description: A string JSON Pointer representing the target path
                      to an element to be affected by the operation
                    example: /description
                  value:
                    oneOf:
                    - type: string
                      example: New description
                      title: string
                    - type: boolean
                      example: true
                      title: boolean
                    - type: integer
                      example: 300
                      title: integer
                    - type: object
                      title: object
                      example:
                        attributes:
                          name: philip
                    - type: array
                      title: array
                      items:
                        anyOf:
                        - type: string
                        - type: integer
                        - type: object
                        example:
                        - '001'
                        - '002'
                        - '003'
                    description: The value to be used for the operation, required
                      for "add" and "replace" operations
                    example: New description
              example:
              - op: replace
                path: /enabled
                value: true
            examples:
              Make an app enabled and matchAllAccounts in one call:
                description: This example shows how multiple fields may be updated
                  with a single patch call.
                value:
                - op: replace
                  path: /enabled
                  value: true
                - op: replace
                  path: /matchAllAccounts
                  value: true
              Replace an owner for an source app:
                description: This example shows how to use patch to replace the source
                  app's owner by replacing the owner's info.
                value:
                - op: replace
                  path: /owner
                  value:
                    id: 2c9180858315595501831958427e5424
              Update the description for the source app:
                description: This example shows how to use patch to update a description
                  for the source app.
                value:
                - op: replace
                  path: /description
                  value: new description for the source app
              Update the name for the source app:
                description: This example shows how to use patch to update the source
                  app's name.
                value:
                - op: replace
                  path: /name
                  value: source app new name
              Add access profile:
                description: Add one access profile to the existing list
                value:
                - op: add
                  path: /accessProfiles/-
                  value: 2c9180857725c14301772a93bb77242d
              Replace access profiles:
                description: Replace all access profiles with a new list of access
                  profiles
                value:
                - op: replace
                  path: /accessProfiles
                  value:
                  - 2c9180857725c14301772a93bb77242d
                  - c9575abb5e3a4e3db82b2f989a738aa2
              Remove access profile:
                description: Remove the first access profile in the list
                value:
                - op: remove
                  path: /accessProfiles/0
      responses:
        '200':
          description: Responds with the source app as updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The source app id
                    example: 2c91808874ff91550175097daaec161c
                  cloudAppId:
                    type: string
                    description: The deprecated source app id
                    example: '9854520'
                  name:
                    type: string
                    description: The source app name
                    example: my app
                  created:
                    type: string
                    description: Time when the source app was created
                    format: date-time
                    example: '2020-10-08T18:33:52.029Z'
                  modified:
                    type: string
                    description: Time when the source app was last modified
                    format: date-time
                    example: '2020-10-08T18:33:52.029Z'
                  enabled:
                    type: boolean
                    default: false
                    description: True if the source app is enabled
                    example: true
                  provisionRequestEnabled:
                    type: boolean
                    default: false
                    description: True if the app allows access request
                    example: true
                  description:
                    type: string
                    nullable: false
                    description: The description of the source app
                    example: the source app for engineers
                  matchAllAccounts:
                    type: boolean
                    default: false
                    description: True if the source app match all accounts
                    example: true
                  appCenterEnabled:
                    type: boolean
                    default: true
                    description: True if the app is visible in the request center
                    example: true
                  accessProfiles:
                    type: array
                    items:
                      type: string
                    nullable: true
                    description: List of IDs of access profiles
                    example:
                    - 2c9180857725c14301772a93bb77242d
                    - c9dc28e148a24d65b3ccb5fb8ca5ddd9
                  accountSource:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                        description: The source ID
                        example: 2c9180827ca885d7017ca8ce28a000eb
                      type:
                        type: string
                        description: The source type, will always be "SOURCE"
                        example: SOURCE
                      name:
                        type: string
                        description: The source name
                        example: ODS-AD-Source
                      useForPasswordManagement:
                        type: boolean
                        default: false
                        description: If the source is used for password management
                        example: ture
                      passwordPolicies:
                        type: array
                        nullable: true
                        description: The password policies for the source
                        items:
                          type: object
                          title: Base Reference Dto
                          properties:
                            type:
                              description: DTO type
                              type: string
                              enum:
                              - ACCOUNT_CORRELATION_CONFIG
                              - ACCESS_PROFILE
                              - ACCESS_REQUEST_APPROVAL
                              - ACCOUNT
                              - APPLICATION
                              - CAMPAIGN
                              - CAMPAIGN_FILTER
                              - CERTIFICATION
                              - CLUSTER
                              - CONNECTOR_SCHEMA
                              - ENTITLEMENT
                              - GOVERNANCE_GROUP
                              - IDENTITY
                              - IDENTITY_PROFILE
                              - IDENTITY_REQUEST
                              - MACHINE_IDENTITY
                              - LIFECYCLE_STATE
                              - PASSWORD_POLICY
                              - ROLE
                              - RULE
                              - SOD_POLICY
                              - SOURCE
                              - TAG
                              - TAG_CATEGORY
                              - TASK_RESULT
                              - REPORT_RESULT
                              - SOD_VIOLATION
                              - ACCOUNT_ACTIVITY
                              - WORKGROUP
                              example: IDENTITY
                            id:
                              type: string
