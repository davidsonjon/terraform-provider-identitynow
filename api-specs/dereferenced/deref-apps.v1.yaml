  /source-apps/v1/bulk-update:
    post:
      operationId: updateSourceAppsInBulkV1
      tags:
      - Apps
      summary: Bulk update source apps
      description: 'This API updates source apps using [JSON Patch](https://tools.ietf.org/html/rfc6902)
        syntax.  It can update up to 50 source apps in a batch.

        The following fields can be updated: **name**, **description**, **enabled**,
